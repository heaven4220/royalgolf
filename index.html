<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D3A">
<title>로얄패밀리 골프동호회</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="color-scheme" content="only light">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Noto+Serif+KR:wght@400;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--board:#1F4D3A;--paper:#FBFBF7;--line:#D9DED4;--fairway:#E8F0E4;--ink:#1A1D1B;--muted:#66706A;--red:#C8102E;--blue:#1f6fb2;--flag:#E3B53C;
--num:'Barlow Condensed',sans-serif;--body:'Pretendard',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--body);background:var(--board);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
header{padding:18px 20px 0;color:var(--paper);max-width:1100px;margin:0 auto;position:relative}
.brand h1{font-family:var(--num);font-weight:800;font-size:38px;letter-spacing:.03em;margin:0;line-height:1}
.brand small{display:block;font-weight:600;font-size:13px;opacity:.7;margin-bottom:4px}
.season{font-family:var(--num);font-size:15px;letter-spacing:.08em;color:var(--flag);margin-top:6px}
.lock{position:absolute;right:20px;top:18px;background:rgba(255,255,255,.12);border:0;color:var(--paper);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.lock.on{background:var(--flag);color:var(--ink)}
nav{display:flex;gap:4px;margin-top:16px}
nav button{background:transparent;border:0;color:rgba(251,251,247,.72);padding:11px 16px;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap}
nav button[aria-selected=true]{background:var(--paper);color:var(--board)}
nav button .ic{display:none}
nav button.admin{display:none} body.admin nav button.admin{display:block}
main{max-width:1100px;margin:0 auto;background:var(--paper);min-height:75vh;border-radius:0 0 14px 14px;padding:24px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar h2{margin:0 auto 0 0;font-size:19px}
.toolbar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
select,input[type=text],input[type=number],input[type=date],input[type=tel],input[type=password]{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.toolbar select{width:auto;max-width:100%}
.btn{border:1px solid var(--board);background:var(--board);color:var(--paper);border-radius:8px;padding:9px 15px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--board)}
.btn.gold{background:var(--flag);border-color:var(--flag);color:var(--ink);font-weight:800}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.pod{background:var(--board);color:var(--paper);border-radius:12px;padding:14px 16px;position:relative;min-height:112px}
.pod .pos{font-family:var(--num);font-size:50px;font-weight:800;line-height:.9;color:var(--flag)}
.pod .nm{font-size:19px;font-weight:700;margin-top:6px}
.pod .meta{font-size:12px;opacity:.75}
.pod .big{position:absolute;right:14px;bottom:12px;font-family:var(--num);font-size:42px;font-weight:700;background:var(--paper);color:var(--ink);padding:0 9px;border-radius:4px;line-height:1.1}
.board{width:100%;border-collapse:separate;border-spacing:0 4px}
.board th{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:6px;white-space:nowrap}
.board th.l,.board td.l{text-align:left}
.board td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;text-align:center;white-space:nowrap}
.board td:first-child{border-left:1px solid var(--line);border-radius:6px 0 0 6px}
.board td:last-child{border-right:1px solid var(--line);border-radius:0 6px 6px 0}
.board tr.me td{background:#FFF7DE}
.tile{display:inline-block;min-width:36px;font-family:var(--num);font-weight:700;font-size:21px;line-height:1.25;padding:0 5px;border-radius:3px;background:var(--paper);border:1px solid var(--line)}
.tile.rank{background:var(--board);color:var(--paper);border-color:var(--board)}
.tile.red,.red,.up{color:var(--red)} .down{color:var(--blue)}
.n{font-family:var(--num);font-size:19px;font-weight:600}
.name{font-weight:700;cursor:pointer;border-bottom:1px dotted var(--muted)}
.chip{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--fairway);color:var(--board);font-weight:600;margin-left:5px}
.chip.gold{background:var(--flag);color:var(--ink)}
.jk-ic{width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block}.rec .ic .jk-ic,.bdg .e .jk-ic,.ttl .e .jk-ic{width:1em;height:1em}.bdg.off .jk-ic{filter:grayscale(1)}
.gj{margin-left:5px;font-size:13px;white-space:nowrap;cursor:default}.gj b{font-family:var(--num);font-size:13px;color:var(--board);margin-left:1px}
.rec{border:1px solid var(--line);border-radius:12px;background:var(--paper);margin:12px 0;overflow:hidden}.rec>div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}.rec>div:first-child{border-top:0}.rec .ic{font-size:20px;width:26px;text-align:center}.rec .t{flex:1;min-width:0}.rec .t b{font-family:var(--num);font-size:17px;letter-spacing:.3px}.rec .t small{display:block;color:var(--muted);font-size:12px}.rec .go{color:var(--muted);font-size:18px}.rec .tap{cursor:pointer}.rec .tap:active{background:var(--fairway)}
.wdl{font-family:var(--num);font-weight:700}.wdl .w{color:var(--red)}.wdl .l{color:var(--blue)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}.bdg{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;background:var(--paper)}.bdg .e{font-size:24px;line-height:1.1}.bdg b{display:block;font-size:12px;margin-top:4px}.bdg small{display:block;font-size:11px;color:var(--muted);margin-top:2px}.bdg.off{opacity:.42;filter:grayscale(1)}.bdg.on{border-color:#EBD48A;background:#FFF7DE}
.titles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:8px 0 4px}.ttl{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);display:flex;gap:10px;align-items:center}.ttl .e{font-size:24px}.ttl .k{font-size:12px;color:var(--muted)}.ttl .v{font-weight:700}.ttl .v small{font-weight:500;color:var(--muted);margin-left:4px}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin-bottom:12px}.h2h .nm{font-weight:700}.h2h .sc{font-family:var(--num);font-size:30px;font-weight:700;letter-spacing:1px}
.rec.jk>div:first-child{background:linear-gradient(90deg,#1F4D3A10,transparent)}
.scroll{overflow-x:auto}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.card h3{margin:0 0 12px;font-size:16px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px;font-weight:600}
.scoregrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.scoregrid label{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;background:#fff}
.scoregrid label small{color:var(--muted);margin-left:4px}
.scoregrid input{width:72px;text-align:center;font-family:var(--num);font-size:21px;font-weight:600;padding:4px}
.scoregrid label.filled{background:var(--fairway);border-color:#b9ccb3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--fairway);border-radius:10px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:var(--num);font-size:28px;line-height:1}
.stats span{font-size:12px;color:var(--muted)}
dialog{border:0;border-radius:14px;padding:0;max-width:680px;width:calc(100% - 20px);max-height:90vh}
dialog::backdrop{background:rgba(10,30,20,.55)}
.mhead{background:var(--board);color:var(--paper);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.mhead h3{margin:0;font-size:19px}
.mhead button{background:none;border:0;color:var(--paper);font-size:24px;cursor:pointer;line-height:1}
.mbody{padding:18px 20px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:18px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:calc(100% - 32px);width:max-content;text-align:center;font-size:14px}
.oldsrv{background:#FBE3E6;color:var(--red);border:1px solid #F2B8C0;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;font-weight:600}
.toast.on{opacity:1}
.loading{padding:60px;text-align:center;color:var(--muted)}
.me-pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.hide-m{} 
/* ---- 라이브 ---- */
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px;animation:blink 1.4s infinite;vertical-align:middle}
@keyframes blink{50%{opacity:.25}}
.seg{display:flex;background:var(--fairway);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--board);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.livehead{background:var(--board);color:var(--paper);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.livehead b{font-size:17px}.livehead small{opacity:.75;font-size:12px}
.topar{font-family:var(--num);font-weight:700;font-size:21px}
.topar.u{color:var(--red)}.topar.e,.topar.o{color:var(--ink)}
.thru{font-size:12px;color:var(--muted)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gcard{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.gcard h4{margin:0;background:var(--fairway);padding:9px 12px;font-size:14px;display:flex;justify-content:space-between}
.sc{width:100%;border-collapse:collapse;font-family:var(--num);font-size:15px}
.sc th,.sc td{border-bottom:1px solid var(--line);text-align:center;padding:3px 1px;min-width:19px}
.sc th{font-size:11px;color:var(--muted);font-weight:600}
.sc td.nm{text-align:left;font-family:var(--body);font-weight:700;font-size:13px;padding-left:10px;white-space:nowrap}
.sc .b{background:#E4EEF8}.sc .bg{background:#FBE3E6}.sc .db{background:#F3D7A0}
.holebar{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.holebar button{flex:0 0 42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-family:var(--num);font-weight:700;font-size:18px;cursor:pointer}
.holebar button.done{background:var(--fairway);border-color:#b9ccb3}
.holebar button.cur{background:var(--board);color:var(--paper);border-color:var(--board)}
.pl{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;margin-bottom:8px}
.pl .who{flex:1}.pl .who b{display:block;font-size:16px}.pl .who span{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--board);background:#fff;color:var(--board);font-size:24px;font-weight:700;cursor:pointer;line-height:1}
.stepper output{min-width:48px;text-align:center;font-family:var(--num);font-size:34px;font-weight:700}
.stepper output.empty{color:var(--line)}
.pinbox{font-family:var(--num);font-size:28px;letter-spacing:.2em;text-align:center}
.nmb{cursor:pointer;border-bottom:1px dashed var(--line)}
.dgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:6px}.dgrid input{text-align:center;padding:6px 0;font-family:var(--num);font-size:15px}
.se-nav{display:flex;align-items:center;justify-content:space-between;background:var(--board);color:var(--paper);border-radius:12px;padding:8px}
.se-nav button{background:rgba(255,255,255,.12);color:var(--paper);border:0;border-radius:9px;width:46px;height:46px;font-size:18px;cursor:pointer}.se-nav button:disabled{opacity:.3}
.se-nav div{text-align:center}.se-nav b{display:block;font-family:var(--num);font-size:28px;letter-spacing:.04em;line-height:1}.se-nav span{font-family:var(--num);font-size:16px;color:var(--flag)}
.se-holes{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:8px 0 10px}.se-holes button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 0;font-family:var(--num);font-size:14px;cursor:pointer}
.se-holes .done{background:var(--fairway);border-color:var(--board)}.se-holes .cur{background:var(--board);color:#fff}
.se-shot{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fff}
.se-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}.se-h b{font-family:var(--num);font-size:19px;color:var(--board)}.se-h span{color:var(--muted);font-size:12px;flex:1}
.se-h .x{border:0;background:var(--fairway);border-radius:7px;width:30px;height:30px;cursor:pointer;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.chips button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 0;min-width:46px;flex:1 0 auto;font-family:var(--num);font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--board);border-color:var(--board);color:#fff}.chips button.bad.on{background:var(--red);border-color:var(--red)}
.chips.dir3 button{flex:1}
.se-row{display:flex;align-items:center;gap:8px;margin:6px 0}.se-row>span{width:74px;flex:none;font-size:12px;color:var(--muted)}.se-row .chips{flex:1;margin:0}
.dstep{display:flex;flex:1;gap:4px;align-items:stretch}.dstep button{border:1px solid var(--line);background:var(--fairway);border-radius:8px;padding:8px 0;flex:1;font-family:var(--num);font-size:14px;cursor:pointer}
.dstep output{flex:1.6;text-align:center;font-family:var(--num);font-size:24px;font-weight:700;line-height:36px;cursor:pointer}.dstep output small{font-size:12px;color:var(--muted);margin-left:2px}
.se-sum{background:var(--fairway);border-radius:10px;padding:10px 12px;font-size:14px;margin:4px 0 10px}.se-sum b{font-family:var(--num);font-size:20px}
.se-foot{display:flex;gap:8px;flex-wrap:wrap}.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px}
.se-ro div{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}.se-ro div>b{font-family:var(--num);width:42px;color:var(--board)}
.sxh{font-family:var(--num);letter-spacing:.06em;color:var(--board);margin:16px 0 8px;font-size:17px}
.lcr{display:flex;border-radius:8px;overflow:hidden;font-size:11px;margin:-4px 0 6px}.lcr i{font-style:normal;background:#F3E3E5;padding:5px 4px;text-align:center;white-space:nowrap;min-width:46px}.lcr i.c{background:var(--fairway)}
.shotbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}.shotbox .seg button{font-size:12px;padding:7px 4px}.shotbox details summary{cursor:pointer;color:var(--board);font-weight:600;font-size:13px;margin-top:6px}
.board.bag td,.board.bag th{padding:6px 8px}
.rcard{cursor:pointer}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rst{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--fairway);color:var(--board);white-space:nowrap}
.rst.open{background:#E4EEF8;color:#1f6fb2}.rst.final{background:#DCEDE1;color:#1F4D3A}.rst.done{background:#E3E3E3;color:#555}.rst.closed{background:#F3D7A0;color:#7a5a00}.rst.group{background:#EFE3F8;color:#6b3fa0}.rst.pre{background:#EFEFEF;color:#666}
.rline{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:13px;color:var(--muted)}
.rline b{color:var(--ink)}
.rcards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.rcards .fc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.rcards .fc>span{font-size:12px;color:var(--muted)}
.rcards .fc>b{font-family:var(--num);font-size:24px;color:var(--board);line-height:1.1}
.rcards .fc>b small{font-size:13px;color:var(--muted);margin-left:2px}
.rcards .fc>small{font-size:11px;color:var(--muted)}
@media(max-width:700px){.rcards{grid-template-columns:repeat(2,1fr)}}
.prow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow:last-child{border-bottom:0}.prow b{font-family:var(--num);font-size:18px}.prow b.ok{color:var(--board)}.prow b.red{color:var(--red)}
.abtns{display:flex;gap:8px}.abtns .btn{flex:1}
.pref{display:flex;gap:8px}.pb{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px;font-weight:600;cursor:pointer}
.pb.on{background:var(--board);color:#fff;border-color:var(--board)}
.plan{background:var(--fairway);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}
.plan.warn{background:#FBE3E6}.plan b{font-family:var(--num);font-size:16px}.plan .sz{font-family:var(--num);font-size:18px;font-weight:700;color:var(--board)}
.gsec{display:flex;flex-direction:column;gap:10px}
.gbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.gbox.bad{border-color:var(--red)}
.gbt{display:flex;align-items:center;gap:8px;background:var(--fairway);padding:8px 12px;font-size:14px}
.gbt b{font-family:var(--num);font-size:18px;color:var(--board)}
.gbt .tee{font-family:var(--num);font-size:15px;background:#fff;padding:2px 8px;border-radius:99px;cursor:pointer}
.gbt small{margin-left:auto;color:var(--muted)}
.gdrop{min-height:56px;padding:8px;display:flex;flex-direction:column;gap:6px}
.gdrop.over{background:#EAF3EE;outline:2px dashed var(--board)}
.pcard{border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;align-items:center;gap:8px;background:var(--paper);cursor:pointer}
.pcard.gst{border-left:3px solid var(--flag)}
.pcard b{font-size:14px}.pcard small{margin-left:auto;color:var(--muted);font-size:12px}
.pcard.dragging{opacity:.4}
.gempty{color:var(--muted);font-size:12px;text-align:center;padding:10px}
.mygrp{background:var(--fairway)}.mygrp b{font-family:var(--num);font-size:26px;color:var(--board)}
.warnc{background:#FFF6E5;font-size:13px;color:#8a5a00;display:flex;flex-direction:column;gap:4px}
.payst{font-size:12px;font-weight:600}.payst.ok{color:var(--board)}.payst.wait{color:#a07a00}
.btn.sm{padding:5px 10px;font-size:12px}
.gchip{font-size:10px;font-weight:700;background:var(--fairway);color:var(--board);border-radius:99px;padding:1px 6px;margin-left:4px}
.rseg button{font-size:12px}

.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pins div{background:var(--fairway);border-radius:10px;padding:8px;text-align:center}
.pins b{display:block;font-family:var(--num);font-size:26px;letter-spacing:.1em}
.pargrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}

/* ==== 대회모드(Tournament Mode) — 골드 테마 ==== */
body.tmode{--gold:#C9A34A;--gold-lt:#F4DEAA;--deep:#16372D;--tm-bg:#122C25}
.tm-hero{background:linear-gradient(150deg,var(--tm-bg),#1E4B3C);color:#F3EFE2;border-radius:16px;padding:18px;position:relative;overflow:hidden}
.tm-hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--gold) 0%,transparent 70%);opacity:.22}
.tm-hero h2{margin:0 0 4px;font-size:22px;color:#F7E9C4}
.tm-hero .tm-meta{font-size:13px;color:#CBD8CD}
.tm-badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--gold);color:#20180A}
.tm-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tm-card{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:13px 14px;text-align:left;cursor:pointer}
.tm-card h3{margin:0 0 3px;font-size:16px}
.tm-card .tm-sub{font-size:12px;color:var(--muted)}
.tm-sub-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tm-sub-nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.tm-sub-nav button[aria-selected="true"]{background:var(--deep);color:#F7E9C4;border-color:var(--deep)}
.tm-box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.tm-box h3{margin:0 0 10px;font-size:15px;color:var(--deep)}
.tm-tbl{width:100%;border-collapse:collapse;font-size:13px}
.tm-tbl th,.tm-tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.tm-tbl th{font-size:11px;letter-spacing:.04em;color:var(--muted)}
.tm-tbl td.n{font-family:var(--num);text-align:right}
.tm-tbl tr.tm-me{background:var(--gold-lt)}
.tm-tbl tr.tm-out{opacity:.45}
.tm-gold{color:#8A6A16;font-weight:700}
.tm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.tm-row>label{font-size:12px;color:var(--muted)}
.tm-in,.tm-sel{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;background:#fff;color:var(--ink);max-width:100%}
.tm-in.sm{width:82px}
.tm-btn{border:1px solid var(--deep);background:var(--deep);color:#F7E9C4;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.tm-btn.gh{background:transparent;color:var(--deep)}
.tm-btn.gd{background:var(--gold);border-color:var(--gold);color:#20180A}
.tm-btn:disabled{opacity:.5}
.tm-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tm-grid2 label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.tm-kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.tm-kv b{font-family:var(--num)}
.tm-flow{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}
.tm-flow span{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tm-flow span.on{background:var(--gold);border-color:var(--gold);color:#20180A;font-weight:700}
.tm-warn{background:#FFF6E5;border:1px solid #E8C877;color:#6B4E00;border-radius:10px;padding:10px 12px;font-size:13px;margin:6px 0}
.tm-blk{background:#FDECEC;border:1px solid #E7A9A9;color:#8A1F1F;border-radius:10px;padding:10px 12px;font-size:13px;margin:6px 0}
.tm-empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
.tm-meta{font-size:12px;color:var(--muted);margin:4px 0}
.tm-hof .y{font-family:var(--num);font-size:20px;color:var(--gold)}
@media(max-width:700px){.tm-tbl th,.tm-tbl td{padding:6px 5px;font-size:12px}.tm-hero h2{font-size:19px}}
/* ══════════ 로얄전당 (ROYAL HALL OF FAME) — 대회모드 내 화면 ══════════ */
.hofwrap{max-width:1100px;margin:0 auto;--hf-gold:#C9A34A;--hf-lt:#F4DEAA;--hf-hi:#FBF3D8;--hf-dk:#8A6B22;--hf-deep:#16372D;--hf-bg:#0A1F19;--hf-stage:#0B211B;--hf-body:#E6EEE9;--hf-mut:#A8BAB0;--hf-dim:#96A99F;--hf-line:rgba(201,163,74,.28);
  --hf-foil:linear-gradient(105deg,#6E5416 0%,#B99539 12%,#E8C877 24%,#FBF3D8 33%,#D9B75E 42%,#8A6B22 54%,#C9A34A 66%,#F4DEAA 78%,#B99539 88%,#6E5416 100%);
  --hf-num:'Barlow Condensed',sans-serif;--hf-se:'Cormorant Garamond',Georgia,serif;--hf-kr:'Noto Serif KR',Georgia,serif;
  color:var(--hf-body)}
.hofwrap .hf-ic{width:1em;height:1em;flex:0 0 auto;display:block}
.hofwrap .hf-btn{background:transparent;border:1px solid rgba(201,163,74,.42);color:var(--hf-lt);font-family:var(--hf-num);font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:9px 14px;border-radius:9px;cursor:pointer}
.hofwrap .hf-btn:hover{background:rgba(201,163,74,.1)}
.hofwrap .hf-blk{background:rgba(200,16,46,.16);border:1px solid rgba(231,169,169,.5);color:#FFD9D9;border-radius:10px;padding:11px 13px;font-size:13px;margin:10px 0}
.hofwrap .hf-warn{background:rgba(201,163,74,.12);border:1px solid rgba(201,163,74,.4);color:var(--hf-lt);border-radius:10px;padding:11px 13px;font-size:12.5px;margin:10px 0;display:flex;gap:8px;align-items:center}
.hofwrap .hf-load{padding:30px;text-align:center;color:var(--hf-mut);font-size:13px}

/* ── 히어로 ── */
.hf-hero{position:relative;overflow:hidden;border-radius:16px;border:1px solid rgba(201,163,74,.34);margin-bottom:12px;
  background:radial-gradient(120% 78% at 50% -6%,rgba(201,163,74,.26) 0%,rgba(201,163,74,.06) 42%,rgba(8,23,19,0) 68%),linear-gradient(180deg,#143A30 0%,#11332A 38%,#0C2620 66%,#081713 100%)}
.hf-damask{position:absolute;inset:0;opacity:.055;mix-blend-mode:screen;background-repeat:repeat;background-size:78px 78px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='78' height='78' viewBox='0 0 78 78'><g fill='none' stroke='%23F4DEAA' stroke-width='1'><path d='M39 6c9 8 14 16 14 25s-6 16-14 24c-8-8-14-15-14-24s5-17 14-25z'/><path d='M39 16c5 5 8 10 8 15s-3 11-8 16c-5-5-8-10-8-16s3-10 8-15z'/><circle cx='39' cy='39' r='3'/><path d='M0 39h16M62 39h16M39 0v16M39 62v16'/></g></svg>")}
.hf-sc{position:absolute;inset:0;pointer-events:none}
.hf-sc i{position:absolute;display:block}
.hf-sc .hill{left:-6%;bottom:40%;width:112%;height:96px;background:#0D271F;border-radius:50% 50% 0 0/100% 100% 0 0}
.hf-sc .hillb{left:24%;bottom:45%;width:68%;height:68px;background:#123328}
.hf-sc .tree{bottom:41%;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:34px solid #0A2019}
.hf-sc .t1{left:7%}.hf-sc .t2{left:13%;border-bottom-width:26px}.hf-sc .t3{left:81%}.hf-sc .t4{left:89%;border-bottom-width:40px}.hf-sc .t5{left:70%;border-bottom-width:24px}
.hf-sc .cl{bottom:40%;width:86px;height:38px;background:#0F2C24;border:1px solid rgba(201,163,74,.3);border-radius:3px 3px 0 0}
.hf-sc .cl::after{content:'';position:absolute;left:11px;top:-10px;width:64px;height:12px;background:#0C251E;border:1px solid rgba(201,163,74,.24);border-radius:12px 12px 0 0}
.hf-sc .c1{left:29%}.hf-sc .c2{left:63%;transform:scale(.7)}
.hf-sc .gf{bottom:0;left:0;right:0;height:40%;background:radial-gradient(72% 130% at 50% 100%,#1C4A3C 0%,#163C31 46%,#0D271F 100%);border-top:1px solid rgba(201,163,74,.18)}
.hf-sc .bp{bottom:36%;left:47.5%;width:2px;height:48px;background:#93A199}
.hf-sc .bp::after{content:'';position:absolute;right:0;top:0;width:17px;height:11px;background:var(--hf-gold);clip-path:polygon(0 0,100% 50%,0 100%)}
.hf-sc .ar{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:70%;height:118px;border:2px solid transparent;border-top-color:var(--hf-gold);border-left-color:var(--hf-gold);border-right-color:var(--hf-gold);border-radius:230px 230px 0 0;opacity:.45}
.hf-sc .ar::after{content:'';position:absolute;inset:10px 10px 0;border:1px solid rgba(244,222,170,.4);border-bottom:0;border-radius:220px 220px 0 0}
.hf-vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 -70px 100px -50px rgba(0,0,0,.85)}
.hf-bokeh{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hf-bokeh i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(244,222,170,.5),rgba(244,222,170,0) 70%)}
.hf-bokeh i:nth-child(1){left:10%;top:52%;width:14px;height:14px}
.hf-bokeh i:nth-child(2){left:26%;top:66%;width:8px;height:8px}
.hf-bokeh i:nth-child(3){left:72%;top:70%;width:11px;height:11px}
.hf-brand{position:relative;text-align:center;padding:30px 18px 24px}
.hf-brand .mono{width:48px;height:43px;margin:0 auto 12px;filter:drop-shadow(0 4px 12px rgba(201,163,74,.5))}
.hf-brand .eb{font-family:var(--hf-num);font-size:12px;font-weight:600;letter-spacing:.5em;text-transform:uppercase;margin:0 0 9px;background:var(--hf-foil);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hfSheen 9s linear infinite}
.hf-brand h2{font-family:var(--hf-se);font-weight:400;font-size:46px;line-height:1;letter-spacing:.14em;margin:0 0 12px;text-transform:uppercase;background:var(--hf-foil);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(201,163,74,.26));animation:hfSheen 9s linear infinite}
.hf-brand .tg{font-family:var(--hf-kr);font-size:13.5px;color:var(--hf-lt);letter-spacing:.24em;margin:0}
.hf-brand .rl{width:200px;height:1px;margin:16px auto 0;position:relative;background:linear-gradient(90deg,transparent,rgba(201,163,74,.85),transparent)}
.hf-brand .rl::after{content:'';position:absolute;left:50%;top:-3px;width:6px;height:6px;transform:translateX(-50%) rotate(45deg);background:var(--hf-gold)}
@keyframes hfSheen{0%{background-position:0% 50%}100%{background-position:220% 50%}}

/* ── 탭 · 필터 ── */
.hf-tabs{display:flex;gap:2px;padding:0 8px;overflow-x:auto;scrollbar-width:none;background:linear-gradient(180deg,#0F2C24,#0B211B);border:1px solid var(--hf-line);border-radius:12px}
.hf-tabs::-webkit-scrollbar{display:none}
.hf-tabs button{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:none;border:0;border-bottom:2px solid transparent;color:var(--hf-mut);font-family:inherit;font-size:13.5px;font-weight:600;padding:13px 15px;cursor:pointer;white-space:nowrap}
.hf-tabs button .hf-ic{font-size:15px;opacity:.85}
.hf-tabs button[aria-selected="true"]{color:var(--hf-lt);border-bottom-color:var(--hf-gold);background:linear-gradient(180deg,rgba(201,163,74,.1),transparent)}
.hf-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 4px}
.hf-filters select{appearance:none;border:1px solid var(--hf-line);color:var(--hf-body);background:#0F2C24 no-repeat right 10px center;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23C9A34A'/></svg>");font-family:inherit;font-size:12.5px;padding:8px 30px 8px 12px;border-radius:9px}
.hf-pills{margin-left:auto;display:flex;gap:8px;align-items:center}
.hf-pill{border:1px solid var(--hf-line);border-radius:999px;padding:5px 12px;font-size:11.5px;color:var(--hf-lt);display:flex;align-items:center;gap:6px;font-family:var(--hf-num);letter-spacing:.06em}
.hf-pill b{color:#89E4AE}

/* ── 무대 ── */
.hf-stage{position:relative;padding:26px 14px 32px;border:1px solid var(--hf-line);border-radius:14px;overflow:hidden;
  background:radial-gradient(70% 62% at 50% 6%,rgba(201,163,74,.15),transparent 66%),linear-gradient(180deg,#0D2820,#081713);
  display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:end}
.hf-spot{position:absolute;left:50%;transform:translateX(-50%);top:-14px;width:560px;height:400px;pointer-events:none;background:linear-gradient(180deg,rgba(255,240,204,.3),rgba(255,240,204,0) 74%);clip-path:polygon(46.5% 0,53.5% 0,75% 100%,25% 100%);filter:blur(15px);animation:hfBreathe 8s ease-in-out infinite}
.hf-beam{position:absolute;left:50%;transform:translateX(-50%);top:0;width:140px;height:74%;pointer-events:none;background:linear-gradient(180deg,rgba(255,244,214,.16),transparent);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);filter:blur(7px)}
.hf-floor{position:absolute;left:4%;right:4%;bottom:6px;height:58px;border-radius:50%;background:radial-gradient(50% 100% at 50% 50%,rgba(201,163,74,.22),transparent 70%);filter:blur(7px)}
@keyframes hfBreathe{0%,100%{opacity:.58}50%{opacity:.9}}
.hf-evt{position:relative;padding-bottom:6px}
.hf-evt .mono{width:30px;height:27px;margin:0 0 9px}
.hf-evt .kind{font-family:var(--hf-num);font-size:11px;font-weight:600;letter-spacing:.34em;color:var(--hf-gold);margin:0 0 7px;text-transform:uppercase}
.hf-evt h3{font-family:var(--hf-kr);font-weight:600;font-size:25px;line-height:1.32;margin:0 0 11px;color:#F8F2E2}
.hf-evt .mt{font-size:12.5px;color:var(--hf-mut);margin:4px 0;display:flex;gap:7px;align-items:center}
.hf-evt .mt b{color:#E4EDE7;font-weight:600}
.hf-evt .mt .hf-ic{font-size:13px;color:var(--hf-gold)}
.hf-hr{height:1px;margin:12px 0;background:linear-gradient(90deg,rgba(201,163,74,.55),transparent)}
.hf-podium{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-bottom:6px}
.hf-slot{display:flex;flex-direction:column;align-items:center;position:relative;z-index:2}
.hf-ped{position:relative;display:grid;place-items:center;border-radius:5px 5px 2px 2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 22px 34px -10px rgba(0,0,0,.78)}
.hf-ped::before{content:'';position:absolute;left:9px;right:9px;top:-14px;height:15px;border-radius:4px 4px 0 0;transform:skewX(-27deg);background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.1))}
.hf-ped::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 -26px 34px rgba(0,0,0,.34),inset 0 26px 22px -18px rgba(255,255,255,.35)}
.hf-ped .rk{font-family:var(--hf-num);font-weight:800;line-height:.86;position:relative;z-index:2;color:rgba(10,26,21,.55);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.hf-ped .eng{position:absolute;bottom:7px;z-index:2;font-family:var(--hf-num);font-size:9.5px;font-weight:700;letter-spacing:.22em;color:rgba(10,26,21,.62);text-transform:uppercase}
.hf-ped .wr{position:absolute;width:84px;height:84px;opacity:.9;z-index:1}
.hf-ped.g{width:186px;height:152px;background:linear-gradient(180deg,#FBF3D8 0%,#EBD08A 14%,#D9B75E 34%,#C9A34A 52%,#A5822F 76%,#7E6119 100%)}
.hf-ped.s{width:150px;height:104px;background:linear-gradient(180deg,#F7F9FA 0%,#DCE0E3 20%,#C0C0C0 46%,#9BA1A6 76%,#7C8287 100%)}
.hf-ped.b{width:150px;height:70px;background:linear-gradient(180deg,#F0D2AC 0%,#DDA466 22%,#CD7F32 50%,#A86226 78%,#7F4A1C 100%)}
.hf-ped.g .rk{font-size:50px}.hf-ped.s .rk,.hf-ped.b .rk{font-size:36px}
.hf-refl{position:absolute;top:100%;left:0;right:0;height:28px;border-radius:0 0 50% 50%;filter:blur(5px);opacity:.5;background:linear-gradient(180deg,var(--rc,rgba(201,163,74,.5)),transparent 78%);transform:scaleY(.4);transform-origin:top}
.hf-slot.silver .hf-fig{--shirt:#2F4E58;--shirt2:#1B2F37;--trim:#DCE0E3}
.hf-slot.gold .hf-fig{--shirt:#B08C2E;--shirt2:#7A5E1C;--trim:#F4DEAA}
.hf-slot.bronze .hf-fig{--shirt:#71492A;--shirt2:#4A301A;--trim:#EBC79C}
.hf-fig{position:relative;width:126px;height:194px;margin-bottom:-1px;--shirt:#1F4D3A;--shirt2:#16372D;--trim:#F4DEAA}
.hf-slot.gold .hf-fig{width:150px;height:230px}
.hf-fig .cp{position:absolute;left:50%;transform:translateX(-50%);top:0;width:52px;height:19px;border-radius:26px 26px 3px 3px;background:linear-gradient(180deg,var(--shirt),var(--shirt2))}
.hf-fig .cp::after{content:'';position:absolute;left:-10px;top:9px;width:27px;height:9px;border-radius:11px;background:var(--shirt2)}
.hf-fig .cp::before{content:'';position:absolute;left:50%;top:2px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%);background:var(--trim);opacity:.85}
.hf-slot.gold .hf-fig .cp{width:60px;height:22px}
.hf-fig .hd{position:absolute;left:50%;transform:translateX(-50%);top:15px;width:50px;height:50px;border-radius:50%;padding:3px;background:conic-gradient(from 205deg,#6E5416,#F4DEAA 24%,#C9A34A 58%,#6E5416);box-shadow:0 7px 18px rgba(0,0,0,.5)}
.hf-slot.gold .hf-fig .hd{width:58px;height:58px;top:17px;padding:3.5px;box-shadow:0 0 0 3px rgba(201,163,74,.2),0 9px 24px rgba(0,0,0,.55)}
.hf-slot.silver .hf-fig .hd{background:conic-gradient(from 205deg,#71767B,#F2F4F6 26%,#C0C0C0 58%,#71767B)}
.hf-slot.bronze .hf-fig .hd{background:conic-gradient(from 205deg,#7F4A1C,#EBC79C 26%,#CD7F32 58%,#7F4A1C)}
.hf-fig .fc{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;background:radial-gradient(circle at 34% 26%,#2C4048,#1A2A26 78%);box-shadow:inset 0 3px 8px rgba(0,0,0,.6)}
.hf-fig .fc img{width:100%;height:100%;object-fit:cover;display:block}
.hf-fig .fc svg{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);width:76%;height:76%;opacity:.88}
.hf-fig .tr{position:absolute;left:50%;transform:translateX(-50%);top:60px;width:70px;height:74px;border-radius:21px 21px 10px 10px;background:linear-gradient(180deg,var(--shirt),var(--shirt2));box-shadow:inset 0 -14px 20px rgba(0,0,0,.32)}
.hf-slot.gold .hf-fig .tr{top:70px;width:82px;height:88px}
.hf-fig .tr::before{content:'';position:absolute;left:50%;transform:translateX(-50%);top:0;width:25px;height:22px;background:linear-gradient(180deg,#0D241E,rgba(13,36,30,.1));clip-path:polygon(0 0,50% 66%,100% 0,50% 100%)}
.hf-fig .bl{position:absolute;left:50%;transform:translateX(-50%);top:132px;width:68px;height:8px;border-radius:3px;background:#14241F}
.hf-slot.gold .hf-fig .bl{top:156px;width:80px}
.hf-fig .bl::after{content:'';position:absolute;left:50%;top:2px;width:6px;height:4px;transform:translateX(-50%);background:var(--trim);opacity:.8;border-radius:1px}
.hf-fig .am{position:absolute;width:13px;height:52px;border-radius:8px;background:linear-gradient(180deg,var(--shirt),var(--shirt2))}
.hf-fig .am.l{left:13px;top:64px;transform-origin:50% 6px;transform:rotate(15deg)}
.hf-fig .am.r{right:13px;top:64px;transform-origin:50% 6px;transform:rotate(-15deg)}
.hf-slot.gold .hf-fig .am{width:15px;height:60px}
.hf-slot.gold .hf-fig .am.l{left:15px;top:74px;transform:rotate(19deg)}
.hf-slot.gold .hf-fig .am.r{right:15px;top:74px;transform:rotate(-106deg)}
.hf-fig .hand{position:absolute;left:-1px;bottom:-7px;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#EBD3BC,#C9A98F)}
.hf-fig .tpy{position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;width:30px;height:34px}
.hf-slot.gold .hf-fig .tpy{width:36px;height:42px}
.hf-fig .lg{position:absolute;left:50%;transform:translateX(-50%);top:140px;display:flex;gap:8px}
.hf-slot.gold .hf-fig .lg{top:164px;gap:9px}
.hf-fig .lg span{position:relative;display:block;width:19px;height:48px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#22322D,#15241F)}
.hf-slot.gold .hf-fig .lg span{width:22px;height:56px}

.hf-note{margin:8px 0 0;font-size:11px;color:rgba(231,226,212,.55)}
.hf-none{margin:4px 0 2px;font-size:12px;color:rgba(231,226,212,.6)}
.hf-memgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:11px;margin:14px 0}
.hf-member{text-align:left;background:linear-gradient(180deg,#16372D,#0F2820);border:1px solid rgba(201,163,74,.3);border-radius:13px;padding:11px 12px;color:#E7E2D4;cursor:pointer;font:inherit}
.hf-member:hover{border-color:#C9A34A}
.hf-member b{display:block;font-size:14px;color:#F4DEAA;margin-bottom:5px}
.hf-member span{display:block;font-size:11.5px;color:rgba(231,226,212,.75);line-height:1.6}
.hf-member i{font-style:normal;font-weight:800;color:#F4DEAA}
.hf-member .last{color:rgba(231,226,212,.45);font-size:10.5px}
.hf-memhead{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
.hf-memhead b{font-size:15px;color:#F4DEAA}
.hf-chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 12px}
.hf-chips span{background:rgba(201,163,74,.12);border:1px solid rgba(201,163,74,.3);border-radius:999px;padding:4px 10px;font-size:11.5px;color:#E7E2D4}
.hf-chips b{color:#F4DEAA}
@media (max-width:620px){.hf-recgrid,.hf-memgrid{grid-template-columns:1fr}}

/* ---- M6: 관리자 설정 · 감사 기록 (모바일 최적화 포함) ---- */
.hf-panel2{margin:10px 0;border:1px solid rgba(201,163,74,.34);border-radius:14px;padding:12px 13px;background:linear-gradient(180deg,#16372D,#0F2820)}
.hf-panel2 h4{display:flex;align-items:center;gap:7px;margin:0 0 10px;font-size:13.5px;color:#F4DEAA;font-weight:800}
.hf-panel2 h4 .cnt{margin-left:auto;font-size:11px;font-weight:600;color:rgba(244,222,170,.6)}
.hf-setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.hf-setgrid label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:rgba(231,226,212,.8)}
.hf-setgrid select,.hf-setgrid input{background:#0F2820;border:1px solid rgba(201,163,74,.35);border-radius:9px;color:#E7E2D4;padding:7px 9px;font:inherit;font-size:12.5px;min-width:0}
.hf-setfoot{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:11px}
.hf-audtbl{width:100%;border-collapse:collapse;font-size:12px}
.hf-audtbl th,.hf-audtbl td{padding:6px 8px;border-bottom:1px solid rgba(201,163,74,.16);text-align:left;color:#E7E2D4;vertical-align:top}
.hf-audtbl th{color:#F4DEAA;font-weight:800;font-size:11px;white-space:nowrap}
.hf-audtbl td.sm{font-size:11px;color:rgba(231,226,212,.62);word-break:break-all}
@media (max-width:620px){
  .hf-setgrid{grid-template-columns:1fr}
  .hf-setgrid select,.hf-setgrid input{font-size:13px}
  .hf-adminbar{flex-wrap:wrap}
  .hf-audtbl{font-size:11.5px}
  .hf-audtbl th:nth-child(3),.hf-audtbl td:nth-child(3),.hf-audtbl th:nth-child(5),.hf-audtbl td:nth-child(5){display:none}
  .hf-reclist li{grid-template-columns:20px 1fr auto;gap:6px}
}

/* ---- 시상대 캐릭터 + 대회사진 크기 (요청 반영) ---- */
.hf-av{width:100%;height:100%;display:block;border-radius:50%}
.hf-mgrid{grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.hf-mcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:12px}
.hf-gal .big img{width:100%;height:230px;object-fit:cover;display:block}
.hf-gal .row .th{height:86px}
.hf-gal .row .th img{width:100%;height:100%;object-fit:cover}
@media (max-width:700px){
  .hf-mgrid{grid-template-columns:1fr}
  .hf-gal .big img{height:190px}
  .hf-gal .row .th{height:70px}
}
/* ---- 업데이트 소식 ---- */
.updday{margin:14px 0 0}
.upddayh{font-weight:700;font-size:12.5px;letter-spacing:.04em;color:#66706A;padding:6px 2px;border-bottom:1px solid rgba(22,55,45,.18);margin-bottom:8px}
.upd{border:1px solid rgba(22,55,45,.18);border-radius:12px;padding:12px 14px;margin:8px 0;background:#fff}
.upd.draft{border-style:dashed;background:rgba(201,163,74,.07)}
.updhd{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.updhd b{font-size:15px;line-height:1.35}
.updmeta{font-size:12px;color:#66706A;margin-top:5px}
.updbody{margin-top:8px;font-size:13.5px;line-height:1.65}
.updbody p{margin:2px 0}
.updact{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.updnew{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:#C9A34A;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.upddesc{margin-top:8px;padding:8px 10px;border-left:3px solid #C9A34A;background:rgba(201,163,74,.09);border-radius:0 8px 8px 0;font-size:12.8px;line-height:1.55}
.upddesc b{display:block;font-size:10.5px;letter-spacing:.05em;color:#8A6A1F;margin-bottom:2px}
.updcard{border:1px solid rgba(22,55,45,.22);border-radius:12px;padding:12px 14px;margin:4px 0 10px;background:rgba(22,55,45,.035)}
.updcard h4{margin:0 0 8px;font-size:14px}
.updg{display:flex;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px dashed rgba(22,55,45,.12)}
.updg:last-of-type{border-bottom:0}
.updg b{min-width:88px;color:#66706A;font-weight:600;flex:0 0 auto}
.att2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.att2{grid-template-columns:1fr}}
.attcol{border:1px solid rgba(22,55,45,.15);border-radius:10px;padding:8px 10px}
.attcolh{display:block;font-size:12px;letter-spacing:.03em;margin-bottom:6px;color:#66706A}
.attrow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed rgba(22,55,45,.12);font-size:13.5px}
.attrow:last-child{border-bottom:0}
.attrow small{color:#66706A;font-size:12px;white-space:nowrap}
/* 개인 스코어카드 정리 */
.prcard{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.prcard-h{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;background:var(--fairway)}
.nine{padding:12px 10px 6px}
.nine + .nine{border-top:1px solid var(--line);margin-top:4px;background:#FCFBF7}
.nine-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.sc2{width:100%;border-collapse:separate;border-spacing:3px 3px;table-layout:fixed}
.sc2 th{font-size:10.5px;font-weight:600;color:#A0A099;padding:0 0 2px}
.sc2 .v{display:block;text-align:center;font:600 12.5px/1 var(--num);padding:6px 0;border-radius:7px;background:#F7F6F1;color:#3A3A36}
.sc2 .v.b{background:#E5EFFA;color:#1D4E7A}
.sc2 .v.bg{background:#FBE9EB;color:#8E3A46}
.sc2 .v.db{background:#F6E3C6;color:#8A5A16}
.sc2 .v.tot{background:var(--board);color:#fff;font-weight:700}
.prcard-sum{display:flex;flex-wrap:wrap;gap:6px 16px;padding:11px 14px;border-top:1px solid var(--line);background:#fff}
.prcard-sum span{display:flex;align-items:baseline;gap:5px}
.prcard-sum b{font-size:12.5px}
.prcard-sum i{font-style:normal;font-weight:700;font-size:15px;font-family:var(--num)}
.prcard-sum small{color:var(--muted);font-size:11.5px}
.prcard-f{padding:8px 14px 12px;border-top:1px solid var(--line);background:#FCFBF7}

<script>
/* ============ 서버 연결 ============ */
const $=s=>document.querySelector(s);
const PW_KEY='golf.adminpw',ME_KEY='golf.me';
let PW=localStorage.getItem(PW_KEY)||'';
let DB=null;
const APP_VERSION = '2026-10-20';
function errMsg(e){const m=String((e&&e.message)||e||'').replace(/^Error:\s*/,'');
  if(/ACCESS_DENIED/.test(m))return '입장 비밀번호 인증이 필요합니다.';
  if(/not found|찾을 수 없|is not defined|not a function/i.test(m))return '서버 코드가 최신이 아닙니다. Code.gs를 새 파일로 교체하고 "새 버전"으로 다시 배포하세요. ('+m+')';
  if(/Lock|timeout|시간/i.test(m))return '다른 사람이 저장 중입니다. 잠시 후 다시 눌러 주세요.';
  return m||'저장하지 못했습니다. 다시 시도하세요';}

/* ---- 공용 비밀번호: 서버가 발급한 토큰을 모든 서버 호출의 첫 인자로 자동 첨부 ---- */
const ACC_KEY='golf.access';
let ACC=localStorage.getItem(ACC_KEY)||'';
const NO_TOKEN=['checkAccessCode','checkAccess'];
const IS_GAS=typeof google!=='undefined'&&google.script&&google.script.run;
  const REMOTE_API=localStorage.getItem('mcd.api')||'https://script.google.com/macros/s/AKfycbzRV8p79_wzRO2xjBLRTHVqdi6houqaPl-FvhidIEgW1m0hZH5v0D2LN03s3KNYrQoVKQ/exec';
function api(fn,...args){
  if(!NO_TOKEN.includes(fn))args=[ACC,...args];
  const p=IS_GAS?new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(e))[fn](...args))
    :(REMOTE_API?fetch(REMOTE_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'mt.api',params:{fn:fn,args:args}})}).then(r=>r.json()).then(j=>{if(j&&typeof j==='object'&&j.ok===false&&j.error)throw new Error(j.error);return j;})
    :new Promise((ok,no)=>{try{ok(Mock[fn](...args))}catch(e){no(e)}})); // 앱 모드: 원격 API / 미리보기
  return p.catch(e=>{if(/ACCESS_DENIED/.test((e&&e.message)||String(e)))lockApp('인증이 만료되었습니다. 다시 입력해 주세요.');throw e});
}
/* ---- 성능: 즉시 페인트 캐시 · 부분 렌더 · 부팅 왕복 통합 ---- */
const DBC_KEY='golf.dbcache';
let __rCache={tab:null,html:'',admin:null};
function setView(html){__rCache.tab=null;__rCache.html='';$('#view').innerHTML=html}
function dbCacheGet(){try{const r=JSON.parse(localStorage.getItem(DBC_KEY)||'null');if(!r||r.v!==APP_VERSION||!r.db)return null;return r.db}catch(e){return null}}
function dbCacheSet(db){if(!db)return;try{localStorage.setItem(DBC_KEY,JSON.stringify({v:APP_VERSION,at:Date.now(),db:db}))}catch(e){}}
function dbCacheClear(){try{localStorage.removeItem(DBC_KEY)}catch(e){}}
function keepAch(d){if(d&&!d.ach&&DB&&DB.ach){d.ach=DB.ach;d.achLoading=false}d&&dbCacheSet(d);return d}
function lockApp(msg){
  ACC='';localStorage.removeItem(ACC_KEY);stopPoll();DB=null;LIVE=null;load.done=0;
  document.querySelectorAll('dialog[open]').forEach(d=>d.close());
  setView('');document.body.classList.add('locked');
  $('#gErr').textContent=msg||'';$('#gCode').value='';setTimeout(()=>$('#gCode').focus(),50);
}
function unlockApp(){document.body.classList.remove('locked');$('#gErr').textContent='';bootLoad()}
function load(){bootLoad()}
/** 로컬 캐시로 즉시 그리고, 서버 응답(1회 왕복)으로 갱신 */
function bootLoad(){
  const cached=dbCacheGet();
  if(cached){DB=cached;DB.achLoading=!DB.ach;render()}
  else setView('<div class="loading">기록을 불러오는 중…</div>');
  api('bootData',PW,null).then(r=>{
    if(!r||r.ok!==true)return lockApp('인증 기간이 지났습니다. 다시 입력해 주세요.');
    afterData(r.data,r.live);
  }).catch(e=>{
    if(/ACCESS_DENIED/.test((e&&e.message)||String(e)))return lockApp('인증 기간이 지났습니다. 다시 입력해 주세요.');
    if(cached)return;
    setView(`<div class="empty">데이터를 불러오지 못했습니다.<br><small>${(e&&e.message)||''}</small></div>`);
  });
}
function afterData(d,live){
  if(d&&!d.ach&&DB&&DB.ach)d.ach=DB.ach;
  DB=d;DB.achLoading=!DB.ach;dbCacheSet(DB);
  if(PW&&!d.isAdmin){PW='';localStorage.removeItem(PW_KEY)}
  render();
  LIVE=live||null;
  if(live&&live.event&&live.event.status==='open'&&!load.done){tab='live';startPoll()}
  load.done=1;render();
  setTimeout(()=>achLoad(true),700);
}
/** 업적은 뒤에서 별도 1회 호출(응답 80% 이상 차지 → 첫 화면을 막지 않음) */
function achLoad(force){
  if(achOn()&&!force)return Promise.resolve();
  if(DB)DB.achLoading=true;
  return api('getAch',PW).then(d=>{
    if(!DB)return;
    DB.ach=(d&&d.ach)||null;DB.achLoading=false;dbCacheSet(DB);
    if((tab==='settings'||tab==='members')&&!document.querySelector('dialog[open]'))render();
    setTimeout(achCheckMine,200);
  }).catch(()=>{if(DB)DB.achLoading=false});
}
$('#gForm').onsubmit=e=>{e.preventDefault();const c=$('#gCode').value.trim();if(!c){$('#gErr').textContent='비밀번호를 입력하세요';return}
  $('#gGo').disabled=true;$('#gErr').textContent='';
  api('checkAccessCode',c).then(r=>{$('#gGo').disabled=false;if(r&&r.ok){ACC=r.token;localStorage.setItem(ACC_KEY,ACC);unlockApp()}
    else{$('#gErr').textContent='비밀번호가 올바르지 않습니다';$('#gCode').value='';const f=$('#gForm');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('#gCode').focus()}})
   .catch(e=>{$('#gGo').disabled=false;$('#gErr').textContent=errMsg(e)})};
$('#outBtn').onclick=()=>{if(confirm('이 기기에서 로그아웃할까요? 다시 들어오려면 공용 비밀번호가 필요합니다.')){PW='';localStorage.removeItem(PW_KEY);localStorage.removeItem('golf.ptok');dbCacheClear();lockApp('로그아웃되었습니다.')}};
function boot(){if(!ACC)return lockApp();bootLoad()}
function call(fn,msg,...args){
  busy(true);
  return api(fn,PW,...args).then(d=>{DB=keepAch(d);busy(false);if(msg)toast(msg);render();if(d&&d.newAch&&d.newAch.length)setTimeout(()=>achUnlock(d.newAch),250);return d})
    .catch(e=>{busy(false);toast(errMsg(e),6000);throw e});
}
function busy(b){document.querySelectorAll('.btn').forEach(x=>x.disabled=b)}
/* load() 는 위 bootLoad() 로 통합되었습니다 (부팅 왕복 4회 → 2회). */

/* ---- 미리보기용 목업 (Apps Script 밖에서 열 때만 사용) ---- */
const Mock=(()=>{
  let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  const names=['김도윤','이서준','박지훈','최민재','정우성','강현우','조성민','윤태호','장민석','임재형','한승우','오지환','서동욱','신영호','권혁준','황민호','안성훈','송기범','류정민','전상철','홍석진','고윤석','문경환','양희철','손태영','배준호','백승현','허정우','남궁민','유재석'];
  const members=names.map((n,i)=>({id:'m'+i,name:n,phone:'010-0000-0000',joined:'2020-03-15',declared:Math.round(8+r()*24),memo:i<3?['회장','총무','경기이사'][i]:''}));

    h.forEach((v,i)=>{if(v==null){run=0;return}const d=v-hd.pars[i];if(d<=-2)eagles++;else if(d===-1)birdies++;run=d<=0?run+1:0;mx=Math.max(mx,run)});fire=Math.max(fire,mx)});

  const all=[...DB.rounds].filter(r=>r.scores[m.id]!=null).sort((a,b)=>String(a.date).localeCompare(String(b.date)));let pb=[],low=null;

function achCheckMine(){const id=me();if(!id||!achOn())return;const raw=localStorage.getItem(SEEN_KEY(id));const cur=Object.keys(achEarned(id));
  if(raw==null){achSeenMark();return}let seen=[];try{seen=JSON.parse(raw)}catch(_){}const nw=cur.filter(k=>!seen.includes(k));if(nw.length&&!$('#dlg').open&&!$('#achPop').open)achUnlock(nw.map(k=>({memberId:id,id:k})));else achSeenMark()}

function vRank(){

  <div class="podium">${ranked.slice(0,3).map(s=>`<div class="pod"><div class="pos">${s.rank}</div><div><div class="nm">${esc(s.m.name)}</div><div class="meta">${s.n}라운드 · 신고 ${s.m.declared}</div></div><div class="big">${fmt(s[rankKey])}</div></div>`).join('')}</div>
  <div class="scroll"><table class="board"><thead><tr><th>순위</th><th class="l">이름</th><th>신고</th><th>조정</th><th>변동</th><th class="hide-m">라운드</th><th class="hide-m">평균 그로스</th><th class="hide-m">평균 네트</th><th class="hide-m">베스트</th></tr></thead>

function dlgClose(){
  ['#dlg','#achPop'].forEach(function(sel){
    const d=$(sel);if(!d)return;
    try{if(d.open)d.close()}catch(_){}
    try{d.removeAttribute('open')}catch(_){}
    try{d.style.display=''}catch(_){}   /* 다시 열 때 반드시 보이도록 되돌린다 */
  });
  try{document.body.classList.remove('dlg-open')}catch(_){}
}
/* 공통 닫기 바인딩 — X · ESC · 배경 클릭 모두 같은 함수 */
(function(){
  const d=$('#dlg'); if(!d)return;
  d.addEventListener('cancel',function(e){e.preventDefault();dlgClose()});
  d.addEventListener('click',function(e){if(e.target===d)dlgClose()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')dlgClose()});
  const a=$('#achPop'); if(a){a.addEventListener('cancel',function(e){e.preventDefault();dlgClose()})}
})();
function openDlg(t,h){
  const d=$('#dlg');
  try{if(d.style.display==='none'||d.hidden)d.style.display=''}catch(_){}
  $('#dlgTitle').textContent=t;$('#dlgBody').innerHTML=h;$('#dlgBody').onclick=null;
  if(d.open){try{d.close()}catch(_){}}          /* 남아 있던 창은 닫고 새로 연다 */
  try{d.showModal()}catch(_){try{d.setAttribute('open','')}catch(_){}}
}

   <label>후반 9홀 코스<select id="lvBack">${courseOptions(e?e.backCourseId:'','코스 선택')}</select></label></div>

function bindLive(){
  const on=(id,ev,fn)=>{const e=$(id);if(e)e[ev]=fn};
  updSync();
  document.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>{liveMode=b.dataset.lm;setupEdit=false;draft={};render()});
  on('#lvRef','onclick',()=>fetchLive(true));
  document.querySelectorAll('[data-shot]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();shotOpen(e.dataset.shot)});
  on('#lvSort','onchange',e=>{liveSort=e.target.value;render()});
  const sendMsg=t=>{const from=$('#lmFrom').value;t=String(t||'').trim();if(!from)return toast('보내는 사람(내 이름)을 선택하세요');if(!t)return toast('메시지를 입력하세요');
    localStorage.setItem(MSG_KEY,from);busy(true);api('postLiveMessage',LIVE.event.id,from,t).then(d=>{busy(false);LIVE=d;lastSync=new Date();const e=$('#lmText');if(e)e.value='';if(document.activeElement)document.activeElement.blur();toast('메시지를 보냈습니다');render()}).catch(e=>{busy(false);toast(errMsg(e),5000)})};
  on('#lmSend','onclick',()=>sendMsg($('#lmText').value));
  on('#lmText','onkeydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sendMsg(e.target.value)}});
  on('#lmFrom','onchange',e=>localStorage.setItem(MSG_KEY,e.target.value));
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>sendMsg(b.dataset.q));
  document.querySelectorAll('[data-dmsg]').forEach(b=>b.onclick=()=>{if(confirm('이 메시지를 삭제할까요?'))api('deleteLiveMessage',PW,b.dataset.dmsg).then(d=>{LIVE=d;render()}).catch(e=>toast(errMsg(e),5000))});
  on('#lvNew','onclick',()=>{liveMode='setup';setupEdit='new';render()});
  on('#lvEdit','onclick',()=>{setupEdit='edit';render()});
  on('#lvCancel','onclick',()=>{setupEdit=false;if(!LIVE.event)liveMode='board';render()});
  const lcall=(fn,msg,...a)=>{busy(true);return api(fn,PW,...a).then(d=>{busy(false);LIVE=d;setupEdit=false;if(msg)toast(msg);render();return d}).catch(e=>{busy(false);toast(errMsg(e),6000);throw e})};
  on('#lvDel','onclick',()=>{if(confirm('라이브 라운드와 홀별 기록을 삭제할까요? (이미 확정해 월별 성적에 저장된 결과는 남습니다)'))lcall('deleteLive','삭제했습니다',LIVE.event.id).then(()=>liveMode='board')});
  on('#lvReopen','onclick',()=>lcall('reopenLive','라운드를 다시 열었습니다',LIVE.event.id));
  on('#lvFin','onclick',()=>{if(!confirm('라운드를 확정하고 월별 성적에 저장할까요?'))return;busy(true);
    api('finalizeLive',PW,LIVE.event.id).then(d=>{busy(false);DB=d;selRound=d.savedId;alert(d.finalMsg);fetchLive(true);if(d.newAch&&d.newAch.length)setTimeout(()=>achUnlock(d.newAch),300)}).catch(e=>{busy(false);toast(errMsg(e),6000)})});
  // setup form
  const sumPar=()=>{const e=$('#parSum');if(!e)return;const s=[...document.querySelectorAll('[data-par]')].reduce((a,i)=>a+(+i.value||0),0);e.textContent='합계 '+s};
  document.querySelectorAll('[data-par]').forEach(i=>i.oninput=sumPar);sumPar();
  const fillPars=()=>{const F=courseHolesOf($('#lvFront').value),B=courseHolesOf($('#lvBack').value),cl=F.concat(B).map(h=>+h.par||4),ds=F.concat(B).map(h=>h.distance==null?'':h.distance);
   if(!cl.length)return;
   document.querySelectorAll('[data-par]').forEach((x,i)=>{if(cl[i])x.value=cl[i]});
   if(ds.some(x=>x!==''))document.querySelectorAll('[data-dist]').forEach((x,i)=>{if(ds[i]!=='')x.value=ds[i]});
   const c=courseById($('#lvFront').value);if(c&&!$('#lvCourse').value)$('#lvCourse').value=c.clubName;
   sumPar();};
  on('#lvFront','onchange',fillPars);on('#lvBack','onchange',fillPars);
  const cntG=()=>{const e=$('#grpCnt');if(!e)return;const sel=[...document.querySelectorAll('[data-grp]')];const n=sel.filter(s=>s.value!=='0').length;const g=new Set(sel.filter(s=>s.value!=='0').map(s=>s.value)).size;e.textContent=`${n}명 · ${g}개 조`;sel.forEach(s=>s.parentElement.classList.toggle('on',s.value!=='0'))};
  document.querySelectorAll('[data-grp]').forEach(s=>s.onchange=cntG);cntG();
  on('#allIn','onclick',()=>{document.querySelectorAll('[data-grp]').forEach(s=>{if(s.value==='0')s.value='1'});cntG()});
  on('#allOut','onclick',()=>{document.querySelectorAll('[data-grp]').forEach(s=>s.value='0');cntG()});
  on('#autoG','onclick',()=>{const sel=[...document.querySelectorAll('[data-grp]')].filter(s=>s.value!=='0');
    const dec=id=>DB.members.find(m=>m.id===id).declared;sel.sort((a,b)=>dec(a.dataset.grp)-dec(b.dataset.grp));
    const G=Math.ceil(sel.length/4);sel.forEach((s,i)=>s.value=String(Math.floor(i/Math.ceil(sel.length/G))+1));cntG();toast(`${G}개 조로 편성했습니다`)});
  on('#lvSave','onclick',()=>{const date=$('#lvDate').value,course=$('#lvCourse').value.trim();if(!date||!course)return toast('날짜와 골프장을 입력하세요');
    const groups={};document.querySelectorAll('[data-grp]').forEach(s=>{if(s.value!=='0')groups[s.dataset.grp]=+s.value});
    const pars=[...document.querySelectorAll('[data-par]')].map(i=>+i.value||4);
    const dists=[...document.querySelectorAll('[data-dist]')].map(i=>+i.value||'');
    lcall('saveLiveEvent',setupEdit==='edit'?'수정했습니다':'라이브 라운드를 시작했습니다',{id:setupEdit==='edit'?LIVE.event.id:null,date,course,pars,groups,dists,frontCourseId:$('#lvFront').value,backCourseId:$('#lvBack').value}).then(()=>{liveMode='setup'})});
  // group login
  on('#pgo','onclick',()=>{const g=$('#pg').value,p=$('#pp').value.trim();api('checkGroupPin',LIVE.event.id,g,p).then(ok=>{if(!ok)return toast('PIN이 올바르지 않습니다');localStorage.setItem(PIN_KEY(LIVE.event.id),JSON.stringify({group:g,pin:p}));
    const rows=liveRows().filter(r=>r.group==g);curHole=Math.min(17,Math.min(...rows.map(r=>r.h.findIndex(x=>x==null)).map(x=>x<0?17:x)));draft={};toast(g+'조 입력을 시작합니다');render()})});

  on('#pOut','onclick',()=>{localStorage.removeItem(PIN_KEY(LIVE.event.id));inputGroup.adminG=null;draft={};render()});
  // hole input
  const par=()=>LIVE.event.pars[curHole];
  const cur=mid=>{if(draft[mid]!==undefined)return draft[mid];const r=liveRows().find(x=>x.m.id===mid);return r.h[curHole]};
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{if(Object.keys(draft).length&&!confirm('저장하지 않은 입력이 있습니다. 이동할까요?'))return;curHole=+b.dataset.h;draft={};render()});
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const mid=b.dataset.st,v=cur(mid);draft[mid]=Math.max(1,Math.min(15,(v==null?par():v)+(+b.dataset.d)));render()});
  document.querySelectorAll('[data-set]').forEach(o=>o.onclick=()=>{const mid=o.dataset.set;if(cur(mid)==null){draft[mid]=par();render()}});
  on('#allPar','onclick',()=>{liveRows().filter(r=>r.group==inputGroup()).forEach(r=>{if(cur(r.m.id)==null)draft[r.m.id]=par()});render()});
  on('#saveHole','onclick',()=>{
    const list=liveRows().filter(r=>r.group==inputGroup());
    const missing=list.filter(r=>cur(r.m.id)==null);
    if(missing.length&&!confirm(missing.map(r=>r.m.name).join(', ')+'님 스코어가 비어 있습니다. 빈 채로 저장할까요?'))return;
    const up={};list.forEach(r=>{const v=cur(r.m.id);if(v!=null)up[r.m.id]={[curHole]:v}});
    if(!Object.keys(up).length){if(curHole<17){curHole++;render()}return}
    const p=myPin()||{};busy(true);
    api('saveLiveScores',PW,p.pin||'',p.group||inputGroup(),LIVE.event.id,up).then(d=>{busy(false);LIVE=d;lastSync=new Date();draft={};toast((curHole+1)+'번 홀 저장');if(curHole<17)curHole++;render();window.scrollTo(0,0)})
      .catch(e=>{busy(false);toast(errMsg(e)||'저장 실패 · 신호를 확인하고 다시 누르세요',6000)});
  });

function seClick(ev){
  const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a.split('|'),k=a[0],i=+a[1],S=SE.shots[i];

  const go=h=>{if(SE.dirty&&!confirm('저장하지 않은 샷 기록이 있습니다. 이동할까요?'))return;SE.hole=h;seLoad();seRender()};
  if(k==='nav')return go(Math.max(0,Math.min(17,SE.hole+i)));
  if(k==='hole')return go(i);
  if(k==='login')return shotLogin(SE.mid);
  if(k==='out'){localStorage.removeItem(PT_KEY);SE.edit=false;toast('개인 로그아웃했습니다');return seRender()}
  if(k==='ana')return seAnalysis();
  if(k==='save')return seSave(i===1);
  if(k==='club'){S.club=S.club===a[2]?'':a[2];mark(S)}
  else if(k==='dir'){S.dir=S.dir===a[2]?'':a[2];mark(S)}
  else if(k==='miss'){S.miss=S.miss===a[2]?'':a[2];mark(S)}
  else if(k==='pen'){S.pen=+a[2];S.penAuto=false;mark(S)}
  else if(k==='res'){const r=S.res===a[2]?'':a[2];S.res=r;mark(S);
    if(BADR.includes(r)&&!S.pen){S.pen=1;S.penAuto=true}else if(!BADR.includes(r)&&S.penAuto){S.pen=0;S.penAuto=false}
    if(r==='GREEN')S.miss='';
    if(r==='GREEN'||r==='FRINGE'){while(SE.shots.length>i+1&&SE.shots[SE.shots.length-1].auto)SE.shots.pop()}
    else if(r&&i===SE.shots.length-1)SE.shots.push(seNew(i+1));
    seChain()}
  else if(k==='sv'){const f=a[2];S[f]=Math.max(0,Math.min(700,(S[f]==null?(f==='dist'?(S.before||150):150):S[f])+(+a[3])));if(f==='before')S.autoB=false;else S.autoD=false;mark(S);seChain()}

  else if(k==='del'){SE.shots.splice(i,1);mark();seChain()}
  else if(k==='num'){
    if(a[1]==='pv'){const v=prompt('첫 퍼트 거리 (m)',SE.putt.before??'');if(v===null)return;SE.putt.before=v===''?null:Math.max(0,Math.min(60,Math.round(+v*10)/10))||null;mark()}
    else{const s=SE.shots[+a[2]],f=a[3],v=prompt(f==='dist'?'샷 거리 (m)':'남은 거리 (m)',s[f]??'');if(v===null)return;s[f]=v===''?null:Math.max(0,Math.min(700,Math.round(+v)))||null;if(f==='before')s.autoB=false;else s.autoD=false;mark(s);seChain()}
  }else return;

}

function shotAgg(rounds){
  const A={rounds:rounds.length,holes:0,firN:0,fir:0,dr:[],dir:{L:0,C:0,R:0,n:0},ob:0,pen:0,girN:0,gir:0,putts:0,puttH:0,p1:0,p2:0,p3:0,fp:[],miss:{SHORT:0,LONG:0,LEFT:0,RIGHT:0},missN:0,appr:{},bag:{}};
  const bump=(o,c)=>o[c]||(o[c]={n:0,d:[],L:0,C:0,R:0,dn:0,gN:0,gH:0});
  rounds.forEach(R=>Object.keys(R.holes||{}).forEach(h=>{
    const list=R.holes[h],par=(R.pars||[])[h-1]||4,sh=list.filter(s=>s.type!=='PUTT'),pt=list.find(s=>s.type==='PUTT');
    if(!sh.length&&!pt)return;A.holes++;
    sh.forEach((s,i)=>{A.pen+=s.pen||0;if(s.res==='OB')A.ob++;const fromTee=i===0||s.lie==='TEE',tee=i===0,app=!fromTee||par===3;
      if(tee&&par>=4){A.firN++;if(s.res==='FAIRWAY')A.fir++;
}
      if(fromTee&&par>=4&&s.club==='DR'){if(s.dist&&s.res!=='OB')A.dr.push(s.dist);if(s.dir){A.dir.n++;A.dir[s.dir[0]]++}}
      if(s.club){const b=bump(A.bag,s.club);b.n++;if(s.dist&&s.res!=='OB')b.d.push(s.dist);if(s.dir){b.dn++;b[s.dir[0]]++}if(app){b.gN++;if(s.res==='GREEN')b.gH++}
        if(app){const p=bump(A.appr,s.club);p.n++;if(s.dist&&s.res!=='OB')p.d.push(s.dist);p.gN++;if(s.res==='GREEN')p.gH++}}
      if(app&&s.res&&s.res!=='GREEN'&&s.miss){A.missN++;A.miss[s.miss]++}});
    if(sh.length){A.girN++;const gi=sh.findIndex(s=>s.res==='GREEN');if(gi>=0&&gi+1+sh.slice(0,gi+1).reduce((a,s)=>a+(s.pen||0),0)<=par-2)A.gir++}
    if(pt&&pt.putts!=null){A.puttH++;A.putts+=pt.putts;if(pt.putts<=1)A.p1++;else if(pt.putts===2)A.p2++;else A.p3++;if(pt.before)A.fp.push(pt.before)}
  }));
  return A;
}

  const nx=n+def,ns=[];for(let i=0;i<Math.floor(nx/4);i++)ns.push(4);if(nx%4===3)ns.push(3);

function rWarn(){
  const w=[],absent={};RE.attendance.forEach(a=>{if(a.status==='불참')absent[a.memberId]=1});
  RE.groups.forEach(g=>{
    if(g.members.length>4)w.push('⚠ '+g.groupNo+'조가 '+g.members.length+'명입니다. (4명 권장)');
    else if(g.members.length<3)w.push('⚠ '+g.groupNo+'조가 '+g.members.length+'명입니다. (3명 이상 권장)');
    const ps={};g.members.forEach(m=>ps[m.pref]=1);if(Object.keys(ps).length>1)w.push('⚠ '+g.groupNo+'조에 내기·명랑 희망이 섞였습니다.');
    g.members.forEach(m=>{if(absent[m.pid])w.push('⚠ '+g.groupNo+'조에 불참 처리된 '+m.name+'님이 있습니다.')});
  });
  return w;
}

function setAtt(status,pref){
  if(!RE.me.mid)return rLogin(function(){
    api('getRound',PW,ptokS(),RE.event.eventId).then(function(d){RE=d;setAtt(status,pref)}).catch(function(e){toast(errMsg(e),6000)});
  });
  const evId=RE.event.eventId;
  optimisticAtt(status,pref);   /* 누르는 즉시 화면에 반영 (체감 지연 제거) */
  const send=ga=>api('setAttendance',PW,ptokS(),evId,RE.me.mid,status,pref||'',ga||'')
    .then(d=>{ATT_BUSY=0;RE=d;render();attDone(status)})
    .catch(e=>{ATT_BUSY=0;
      if(/개인 PIN/.test(errMsg(e))){localStorage.removeItem('golf.ptok');RE.me.mid=null}
      api('getRound',PW,ptokS(),evId).then(function(d){RE=d;render()}).catch(function(){render()});
      toast(errMsg(e),5000)});
  if(status==='불참'){
    const mine=RE.guests.filter(g=>g.mine);
    if(mine.length){
      openDlg('참석을 취소하시겠습니까?',`<p class="note" style="margin-top:0">등록하신 게스트가 있습니다.</p>
       <div class="card" style="margin:0;display:flex;flex-direction:column;gap:8px"><button class="btn" id="gKeep">게스트 유지</button><button class="btn danger" id="gCancel">게스트도 함께 취소</button></div>
       <p class="note">${mine.map(g=>esc(g.name)).join(', ')}</p><button class="btn ghost" id="gX" style="width:100%">돌아가기</button>`);
      $('#gKeep').onclick=()=>{dlgClose();send('keep')};
      $('#gCancel').onclick=()=>{dlgClose();send('cancel')};
      $('#gX').onclick=()=>dlgClose();
      return;
    }
  }
  send('');
}
function payToggle(payId,state){

function moveLocal(pid,to){
  let p=null;RE.groups.forEach(g=>{const i=g.members.findIndex(x=>x.pid===pid);if(i>=0)p=g.members.splice(i,1)[0]});
  if(!p)return;
  let tg=RE.groups.find(g=>g.groupNo===+to);
  if(!tg){tg={groupNo:+to,teeTime:'',pref:p.pref,members:[]};RE.groups.push(tg);RE.groups.sort((a,b)=>a.groupNo-b.groupNo)}
  tg.members.push(p);RE.groups.forEach(g=>g.size=g.members.length);render();
}
function moveCard(pid){
  const cur=RE.groups.find(g=>g.members.some(m=>m.pid===pid));if(!cur)return;
  const pn=cur.members.find(m=>m.pid===pid);
  const maxNo=Math.max.apply(null,RE.groups.map(g=>g.groupNo).concat([0]))+1;
  openDlg('다른 조로 이동',`<p class="note" style="margin-top:0">${esc(pn.name)} · 현재 ${cur.groupNo}조</p>
   <div class="chips">${[...Array(maxNo)].map((_,i)=>i+1).map(n=>`<button data-mv="${n}" class="${n===cur.groupNo?'on':''}">${n}조</button>`).join('')}</div>
   <button class="btn ghost" id="mvX" style="width:100%;margin-top:10px">닫기</button>`);
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{dlgClose();moveLocal(pid,b.dataset.mv)});
  $('#mvX').onclick=()=>dlgClose();
}

/* =====================================================================
 * 개인 라운딩 · 코스 DB · 핸디 스냅샷  (2026-10-12)
 *  - 표시는 "확정 스냅샷 우선 → 없으면 현재값" 순서로 읽는다.
 *  - 개인 라운딩은 본인 개인 PIN(ptok)으로만 접근한다.

const rresOf=(rid,mid)=>((DB&&DB.results&&DB.results[rid])||{})[mid]||null;
const memById=id=>(DB&&DB.members.find(m=>m.id===id))||{id:id,name:'',declared:0};
const hcpFor=(r,mid)=>{const x=rresOf(r.id,mid);return x&&x.hcp!=null?x.hcp:Number(memById(mid).declared)||0};
const netFor=(r,mid)=>{const x=rresOf(r.id,mid);return x&&x.net!=null?x.net:r.scores[mid]-hcpFor(r,mid)};
const hcpAdj=(rid,mid)=>{const x=rresOf(rid,mid);return !!(x&&x.status==='정정')};
const courseById=id=>(DB&&(DB.courses||[]).find(c=>c.courseId===id))||null;
const courseHolesOf=id=>((DB&&DB.courseHoles)||[]).filter(h=>h.courseId===id).sort((a,b)=>+a.holeNo-+b.holeNo);
function courseOptions(sel,blank){return `<option value="">${blank||'선택 안 함'}</option>`+((DB&&DB.courses)||[]).map(c=>`<option value="${c.courseId}" ${c.courseId===sel?'selected':''}>${esc(c.clubName)} · ${esc(c.courseName)} (Par ${c.par})</option>`).join('')}

/* ---- 관리자: 라운드 적용핸디 정정 ---- */
function scoreFix(rid,mid){
  const m=memById(mid),r=DB.rounds.find(x=>x.id===rid),x=rresOf(rid,mid);

  openDlg('적용 핸디 수정',`<p class="note" style="margin-top:0">${esc(m.name)} · ${esc(r.date)} 라운드에 <b>적용된 핸디</b>를 수정합니다. 이후 회원 핸디를 바꿔도 이 라운드의 넷·순위는 그대로 유지됩니다. (수정 이력은 결과에 기록됩니다)</p>
   <div class="form"><label>적용 핸디<input type="number" id="fxH" value="${x&&x.hcp!=null?x.hcp:m.declared}" min="-20" max="54"></label><label>사유<input type="text" id="fxR" placeholder="예: 입력 오류 정정"></label></div>
   <p class="note">그로스 ${r.scores[mid]} · 현재 넷 ${x&&x.net!=null?x.net:'–'} → <b id="fxP">–</b></p>
   <button class="btn" id="fxGo" style="margin-top:10px">저장</button>`);

function psRoundStat(r){
  const hs=r.holes||{},ks=Object.keys(hs);let shots=0,putts=0,ph=0,pen=0;
  ks.forEach(function(h){(hs[h]||[]).forEach(function(s){if(s.type==='PUTT'){putts+=Number(s.putts)||0;ph++}else{shots++;pen+=Number(s.pen)||0}})});
  return{holes:ks.length,shots:shots,putts:putts,ph:ph,pen:pen};

      let thru=0,toPar=0,gross=0;
