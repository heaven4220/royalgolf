let PRLM='board',PRLH=0,PRLD={},PRLST='자동 저장';
function prLive(prId){
  PRLM='board';PRLD={};PRLST='자동 저장';
  api('getPersonalRoundLive',ptokS(),prId).then(function(d){PRL=d;PRLH=prNextHole();prLiveRender()}).catch(function(e){toast(errMsg(e),6000)});
}
function prLiveTotals(){prLiveRender()}
function prLivePlayers(){
  const ps=(PRL&&PRL.players)||[];
  return ps.length?ps:[{id:'',name:'나',isMe:true,holes:(PRL&&PRL.holes)||[]}];
}
function prParsOf(){return String((PRL&&PRL.round&&PRL.round.pars)||'').split(',').map(function(x){return Number(x)||4})}
function prRowsOf(){
  const pars=prParsOf();
  return prLivePlayers().map(function(p){
    const h=Array.from({length:18},function(_,i){const x=(p.holes||[]).filter(function(y){return Number(y.holeNo)===i+1})[0];return x&&x.score!=null?Number(x.score):null});
    let thru=0,toPar=0,gross=0;
    h.forEach(function(v,i){if(v==null)return;thru++;gross+=v;toPar+=v-pars[i]});
    return {p:p,id:String(p.id||''),name:p.name||'나',isMe:!!p.isMe,h:h,thru:thru,gross:gross,toPar:toPar};
  });
}
function prNextHole(){
  const rows=prRowsOf();if(!rows.length)return 0;
  let m=18;rows.forEach(function(r){r.h.forEach(function(v,i){if(v==null&&i<m)m=i})});
  return m>=18?0:m;
}
function prBoardHtml(rows,pars){
  const st=rows.slice().sort(function(a,b){if(!a.thru)return 1;if(!b.thru)return -1;return a.toPar-b.toPar||b.thru-a.thru});
  let prev=null,k=0;
  st.forEach(function(x,i){if(!x.thru){x.rank=null;return}if(x.toPar!==prev){k=i+1;prev=x.toPar}x.rank=k});
  return `<div class="toolbar"><h2 style="font-size:16px">전체 순위 <small style="color:var(--muted);font-weight:500">${rows.filter(function(x){return x.thru}).length}/${rows.length}명 진행</small></h2></div>
  <div class="scroll"><table class="board"><thead><tr><th>순위</th><th class="l">이름</th><th>그로스</th><th>파 대비</th><th>홀</th></tr></thead><tbody>
  ${st.map(function(x){return `<tr class="${x.isMe?'me':''}"><td>${x.rank?`<span class="tile rank">${x.rank}</span>`:'–'}</td><td class="l"><b class="nmb" data-plshot="${x.isMe?'1':''}">${esc(x.name)}</b>${x.isMe?' <span class="chip gold">나</span>':''}</td><td class="n">${x.thru?x.gross:'–'}</td><td><span class="topar ${tpc(x.toPar)}">${tp(x.toPar)}</span></td><td class="thru">${x.thru===18?'F':(x.thru||'–')}</td></tr>`}).join('')}
  </tbody></table></div>
  <p class="note">파 대비 = 홀별 (타수 − 파)의 합계입니다. 내 이름을 누르면 샷 기록을 볼 수 있습니다. 진행 중에는 20초마다 자동 갱신됩니다.</p>`;
}
function scoreCardHtml(list,pars,title,sub){
  const nine=function(s,name){
    const idx=Array.from({length:9},function(_,i){return i+s});
    const outPar=idx.reduce(function(a,i){return a+(pars[i]||4)},0);
    const body=list.map(function(x){
      const cells=idx.map(function(i){
        const y=x.h[i];if(y==null)return '<td><span class="v">&nbsp;</span></td>';
        const d=y-pars[i];const cls=d<=-1?'b':d>=3?'db':d===2?'bg':'';
        return `<td><span class="v ${cls}">${y}</span></td>`;
      }).join('');
      const sum=idx.reduce(function(a,i){return a+(x.h[i]||0)},0);
      return `<tr><td class="nm">${esc(x.name)}</td>${cells}<td><span class="v tot">${sum||''}</span></td></tr>`;
    }).join('');
    return `<div class="nine"><div class="nine-h"><b>${name}</b><span>파 ${outPar}</span></div>
      <table class="sc2"><tr><th class="nm">홀</th>${idx.map(function(i){return `<th>${i+1}</th>`}).join('')}<th>계</th></tr>
      <tr class="par"><td class="nm">파</td>${idx.map(function(i){return `<td><span class="v parv">${pars[i]||4}</span></td>`}).join('')}<td><span class="v par v">${outPar}</span></td></tr>
      ${body}</table></div>`;
  };
  return `<div class="prcard">
    <div class="prcard-h"><b>${esc(title)}</b><small>${sub}</small></div>
    ${nine(0,'전반 9홀')}
    ${nine(9,'후반 9홀')}
    <div class="prcard-sum">${list.map(function(x){return `<span><b>${esc(x.name)}</b><i class="topar ${tpc(x.toPar)}">${tp(x.toPar)}</i><small>${x.thru?x.gross+'타':'기록 전'}</small></span>`}).join('')}</div>
    <div class="prcard-f"><div class="lg"><span><i style="background:#E5EFFA"></i>버디 이하</span><span><i style="background:#FBE9EB"></i>더블보기</span><span><i style="background:#F6E3C6"></i>트리플 이상</span><span style="margin-left:auto">합계는 입력된 홀만</span></div></div>
  </div>`;
}
function prCardHtml(rows,pars){
  const th=rows.length?Math.min.apply(null,rows.map(function(x){return x.thru})):0;
  const played=rows.filter(function(x){return x.thru}).slice().sort(function(a,b){return a.toPar-b.toPar});
  let lead='';
  if(played.length>1){const gap=Math.round((played[1].toPar-played[0].toPar)*10)/10;lead=gap<=1?(gap===0?'동타 접전':'1타 차 접전'):esc(played[0].name)+' 선두'}
  else if(played.length===1) lead=esc(played[0].name)+' 선두';
  const sub=(th===18?'18홀 완료':th?th+'홀 진행 중':'대기')+(lead?' · '+lead:'');
  return scoreCardHtml(rows,pars,(PRL&&PRL.round&&PRL.round.clubName)||'개인 라운딩',sub);
}

function prInputHtml(rows,pars){
  const list=rows,cur=PRLH,par=pars[cur]||4;
  const done=function(i){return list.every(function(x){return x.h[i]!=null})};
  return `<div class="toolbar"><h2 style="font-size:16px">스코어 입력</h2><span class="note" id="plSaveState">${esc(PRLST)}</span></div>
  <div class="holebar">${pars.map(function(p,i){return `<button data-plh="${i}" class="${i===cur?'cur':done(i)?'done':''}" aria-label="${i+1}번 홀">${i+1}</button>`}).join('')}</div>
  <div class="card" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;padding:12px 16px"><div><b style="font-family:var(--num);font-size:30px">${cur+1}번 홀</b> <span style="color:var(--muted)">파 ${par}</span></div>
   <button class="btn ghost" id="plAllPar" style="padding:5px 10px">모두 파</button></div>
  ${list.map(function(x){const key=x.id+'|'+(cur+1);const has=PRLD[key]!==undefined;const v=has?PRLD[key]:x.h[cur];const d=v==null?null:v-par;
    return `<div class="pl"><div class="who"><b>${esc(x.name)}</b><span>현재 ${tp(x.toPar)} · ${x.thru}홀</span></div>
    <div class="stepper"><button data-pls="${key}" data-d="-1" aria-label="${esc(x.name)} 한 타 줄이기">−</button><output class="${v==null?'empty':''}" data-plo="${key}">${v==null?par:v}</output><button data-pls="${key}" data-d="1" aria-label="${esc(x.name)} 한 타 늘리기">+</button></div>
    <div style="width:44px;text-align:center" class="topar ${tpc(d)}">${d==null?'':tp(d)}</div></div>`}).join('')}
  <div class="sticky-save"><button class="btn" id="plSaveHole" style="width:100%;padding:14px;font-size:16px">${cur+1}번 홀 저장${cur<17?' → 다음 홀':''}</button></div>
  <p class="note">회색 숫자는 아직 입력 전(파 기준)입니다. −/+ 로 조정하고 저장하면 동반자 기록까지 함께 저장됩니다.</p>`;
}
function prSaveHole(){
  const pars=prParsOf(),rows=prRowsOf(),h=PRLH+1,par=pars[PRLH]||4;
  const jobs=rows.map(function(x){const key=x.id+'|'+h;const v=(PRLD[key]!==undefined)?PRLD[key]:x.h[PRLH];return {playerId:x.id,score:(v==null?'':v)}});
  const prev=jobs.map(function(j){return {playerId:j.playerId,score:(function(){const p=prLivePlayers().filter(function(x){return String(x.id||'')===j.playerId})[0];return p?((p.holes||[]).filter(function(y){return Number(y.holeNo)===h})[0]||{}).score:null})()}});
  const apply=function(js){js.forEach(function(j){const p=prLivePlayers().filter(function(x){return String(x.id||'')===j.playerId})[0];if(!p)return;
    const row=(p.holes||[]).filter(function(y){return Number(y.holeNo)===h})[0];const val=(j.score===''||j.score==null)?null:Number(j.score);
    if(row)row.score=val;else (p.holes=p.holes||[]).push({holeNo:h,par:par,score:val,putts:null})})};
  const t0=Date.now();
  apply(jobs);PRLD={};PRLST='저장 중…';if(h<18)PRLH=h;else PRLH=0;prLiveRender();   // 화면 먼저 반영
  api('savePersonalHoles',ptokS(),PRL.round.prId,h,jobs).then(function(){
    PRLST='저장됨 '+new Date().toTimeString().slice(0,5)+' · '+((Date.now()-t0)/1000).toFixed(1)+'초';
    const e=$('#plSaveState');if(e){e.textContent=PRLST;e.style.color='#3f7a5a'}
    const hd=$('#plState');if(hd)hd.textContent=PRLST;
  }).catch(function(e){
    apply(prev);PRLST='저장 실패 — 다시 시도';prLiveRender();
    const st=$('#plSaveState');if(st){st.textContent=PRLST;st.style.color='#b23b3b'}
    toast(errMsg(e),6000);
  });
}

function prLiveRender(){
  const box=$('#prBox');if(!box||!PRL||!PRL.round)return;
  const r=PRL.round,pars=prParsOf(),rows=prRowsOf(),par=pars.reduce(function(a,b){return a+b},0);
  const prog=rows.length?Math.max.apply(null,rows.map(function(x){return x.thru})):0;
  const open=r.status!=='완료';
  const head=`<div class="livehead"><div>${open?'<span class="lv-pill"><span class="live-dot" style="background:#fff;margin-right:4px;width:7px;height:7px"></span>LIVE</span>':''}<b>${esc(r.clubName||'개인 라운딩')}</b><br><small>${esc(r.date)} · ${open?'진행 중':'확정 완료'} · 파 ${par}</small></div>
   <div style="text-align:right"><small id="plState">${esc(PRLST)}</small><br><button class="btn ghost" id="plRef" style="color:var(--paper);border-color:rgba(255,255,255,.4);padding:5px 10px;margin-top:4px">새로고침</button></div>
   <div class="lv-prog"><span>진행 <b style="font-size:13px">${prog} / 18홀</b></span><i><b style="width:${prog/18*100}%"></b></i></div></div>`;
  const seg=`<div class="seg"><button data-plm="board" aria-pressed="${PRLM==='board'}">전체 순위</button><button data-plm="card" aria-pressed="${PRLM==='card'}">스코어카드</button>${open?`<button data-plm="input" aria-pressed="${PRLM==='input'}">스코어 입력</button>`:''}</div>`;
  const body=PRLM==='card'?prCardHtml(rows,pars):PRLM==='input'?prInputHtml(rows,pars):prBoardHtml(rows,pars);
  box.innerHTML=head+seg+body+`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${open?`<button class="btn" id="plFinish">라운드 마치기</button>`:''}<button class="btn ghost" id="plBack">개인 라운딩 목록</button></div>`;
  box.querySelectorAll('[data-plm]').forEach(function(b){b.onclick=function(){PRLM=b.dataset.plm;PRLD={};prLiveRender()}});
  const rf=$('#plRef');if(rf)rf.onclick=function(){prLive(r.prId)};
  const bk=$('#plBack');if(bk)bk.onclick=function(){prLoad(PRM,PRRO)};
  const pl=bk;if(pl){}
  box.querySelectorAll('[data-plshot]').forEach(function(b){if(b.dataset.plshot==='1')b.onclick=function(){psOpen(r.prId,0)}});
  const fin=$('#plFinish');
  if(fin)fin.onclick=function(){if(!confirm('라운드를 마치고 개인 라운딩 기록으로 저장할까요?'))return;busy(true);
    api('finishPersonalRound',ptokS(),r.prId).then(function(){busy(false);toast('라운드를 마쳤습니다');prResult(r.prId)}).catch(function(e){busy(false);toast(errMsg(e),6000)})};
  if(PRLM==='input'){
    box.querySelectorAll('[data-plh]').forEach(function(b){b.onclick=function(){PRLH=Number(b.dataset.plh);PRLD={};prLiveRender()}});
    box.querySelectorAll('[data-pls]').forEach(function(b){b.onclick=function(){
      const key=b.dataset.pls,parts=key.split('|'),gid=parts[0],hh=Number(parts[1]);
      const x=prRowsOf().filter(function(y){return y.id===gid})[0];if(!x)return;
      const cur=(PRLD[key]!==undefined)?PRLD[key]:(x.h[hh-1]==null?null:x.h[hh-1]);
      let v=(cur==null?pars[hh-1]:cur)+Number(b.dataset.d);
      v=Math.max(1,Math.min(20,v));PRLD[key]=v;
      const o=box.querySelector('[data-plo="'+key+'"]');if(o){o.textContent=v;o.className=''}
      const chip=b.parentElement.parentElement.querySelector('.topar');if(chip){const d=v-pars[hh-1];chip.textContent=tp(d);chip.className='topar '+tpc(d)}
    }});
    const ap=$('#plAllPar');
    if(ap)ap.onclick=function(){prRowsOf().forEach(function(x){PRLD[x.id+'|'+(PRLH+1)]=pars[PRLH]||4});prLiveRender()};
    const sv=$('#plSaveHole');if(sv)sv.onclick=prSaveHole;
  }
}

function myHcpView(mid){

    const m=memById(mid);
    $('#mhBox').innerHTML=myHcpHtml(m.name,m.declared,hs);

  }
  api('getMyHandicap',ptokS(),mid).then(d=>{const b=$('#mhBox');if(b)b.innerHTML=myHcpHtml(d.name,d.declared,d.history,d.recommended,d.rounds,d.reason)})
    .catch(e=>{const b=$('#mhBox');if(!b)return;const em=errMsg(e);if(/개인 PIN/.test(em)){pinFixBox(b,mid,()=>myHcpView(mid));return}b.innerHTML=`<div class="empty">${esc(em)}</div>`});

function myHcpHtml(name,dec,hs,rec,rounds,reason){
  const h=hs||[];
  const rows=h.map(x=>{const o=x.oldHandicap??x.old,n=x.newHandicap??x.cur;return `<tr><td class="l">${esc(x.effectiveDate||'')}</td><td class="n">${o}</td><td class="n"><span class="tile ${+n<+o?'red':''}">${n}</span></td><td>${typeTag(x.changeType)}</td><td class="l hide-m">${esc(x.reason||'')}</td></tr>`}).join('');
  const r5=(rounds||[]).map(x=>`<tr><td class="l">${esc(x.date)}</td><td class="l">${esc(x.course||'')}</td><td class="n">${x.gross}</td><td class="n">${x.par}</td><td class="n">${sign(x.diff)}</td></tr>`).join('');
  return `<div class="stats"><div><b>${dec}</b><span>현재 신고핸디</span></div><div><b>${rec==null?'–':mgNum(rec)}</b><span>추천핸디</span></div><div><b>${h.length}</b><span>변경 횟수</span></div><div><b>${rounds?rounds.length:'–'}</b><span>최근 라운드</span></div></div>
  ${reason?`<p class="note" style="margin-top:0">추천 근거 · ${esc(reason)}</p>`:''}
  ${r5?`<p class="note" style="margin:10px 0 4px"><b>추천 계산에 사용한 라운드</b> <small>코스 Par 반영</small></p><div class="scroll"><table class="board"><thead><tr><th class="l">날짜</th><th class="l">골프장</th><th>스코어</th><th>Par</th><th>파 대비</th></tr></thead><tbody>${r5}</tbody></table></div>`:''}
  <p class="note" style="margin:10px 0 4px"><b>${esc(name)}님의 핸디 변경 이력</b></p>
  ${rows?`<div class="scroll"><table class="board"><thead><tr><th class="l">적용일</th><th>이전</th><th>변경</th><th>구분</th><th class="l hide-m">사유</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="note">변경 이력이 없습니다.</p>'}

}

function hcpReviewOpen(month){

function hcpReviewRender(){
  const box=$('#hrBox');if(!box||!HRD)return;const rs=HRD.reviews||[],pend=rs.filter(r=>r.status==='대기'),done=rs.filter(r=>r.status!=='대기');

    return `<div class="rvw ${r.status==='대기'?(d<0?'dn':d>0?'up':''):''}"><div class="hd"><b>${esc(r.name)}</b>
      <span class="dl">${r.current==null?'–':r.current} → ${r.recommended==null?'–':r.recommended}</span>
      <span class="tag">${d===0?'변동 없음':(d>0?'+':'')+d+'타'}</span>
      <span class="tag">기록 ${r.roundCount}회${r.roundCount<5?' · 부족':''}</span>

     <p class="note" style="margin:6px 0 0">${esc(r.reason)}</p>
     <div class="btns">${r.status==='대기'?`${r.recommended!=null?`<button class="btn mini" data-hrok="${r.reviewId}">승인</button>`:''}<button class="btn ghost mini" data-hrhold="${r.reviewId}">보류</button><button class="btn ghost mini" data-hrman="${r.reviewId}">수동 조정</button>`:'<span class="note">처리 완료</span>'}
      <button class="btn ghost mini" data-hrbasis="${r.reviewId}">근거 보기</button></div></div>`};
  box.innerHTML=`<div class="form"><label>검토 월<select id="hrMon"><option value="">전체</option>${(HRD.months||[]).map(m=>`<option ${m===HRM?'selected':''}>${m}</option>`).join('')}</select></label></div>`
   +`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px"><button class="btn" id="hrRun">이번 달 검토 실행</button>${HRM?`<button class="btn ghost" id="hrAll">전체 보기</button>`:''}</div>`
   +`<p class="note" style="margin:0 0 6px"><b>승인 대기 ${pend.length}건</b> · 5회 미만 기록 회원은 추천값 없이 표시됩니다. 승인 시 적용일 기준으로 이력에 남습니다.</p>`
   +(pend.map(card).join('')||'<p class="note">승인 대기 건이 없습니다.</p>')
   +(done.length?`<p class="note" style="margin:12px 0 6px"><b>처리 완료 ${done.length}건</b></p>`+done.map(card).join(''):'');
  const mo=$('#hrMon');if(mo)mo.onchange=()=>hcpReviewOpen(mo.value);
  const al=$('#hrAll');if(al)al.onclick=()=>hcpReviewOpen('');
  const run=$('#hrRun');if(run)run.onclick=()=>{if(!confirm('이번 달 검토를 실행할까요?\n추천값만 계산합니다. 승인 전에는 핸디가 바뀌지 않습니다.'))return;
    busy(true);api('hcpReviewRun',PW,'').then(d=>{busy(false);HRD=d;HRM=d.month||'';DB.hcpReviews=d.reviews;toast(d.msg||'검토했습니다',5000);hcpReviewRender();render()}).catch(e=>{busy(false);toast(errMsg(e),6000)})};

function hcpDecide(rid,action){
  if(action==='승인'&&!confirm('이 추천핸디를 승인할까요?'))return;
  busy(true);api('decideHcpReview',PW,rid,action,'','').then(d=>{busy(false);HRD=d;toast(d.msg||'처리했습니다',6000);
    if(d.newAch&&d.newAch.length)setTimeout(()=>achUnlock(d.newAch),250);
    api('getData',PW).then(x=>{DB=x;hcpReviewRender();render()}).catch(()=>hcpReviewRender())}).catch(e=>{busy(false);toast(errMsg(e),7000)})}
function hcpManual(rid){

function hcpBasis(rid){

function partnerCommitMonth(ym){

  if(!items.length)return toast('등록할 회원이 없습니다. 미매칭 이름을 먼저 지정하세요');
  const un=P.groups.reduce((a,g)=>a+g.members.filter(m=>!m.memberId).length,0);
  if(un&&!confirm('미매칭 이름 '+un+'건은 건너뜁니다. '+ym+'을(를) 등록할까요?'))return;
  busy(true);
  api('partnerCommit',PW,items,PAV).then(d=>{busy(false);PAD=d;PPV=null;toast(d.msg||'등록했습니다',6000);partnerAdminRender();if(DB)DB.partnerMonths=d.monthCount}).catch(e=>{busy(false);toast(errMsg(e),7000)});
}

const TM_ST = ['준비', '참가신청', '핸디확정', '경기진행', '기록검증', '시상검토', '시상확정', '완료'];
const TS = {
  list: null, total: 0, hofCount: 0, tid: '', view: 'list', sub: 'home',

};
const TM_PTOK = () => localStorage.getItem('golf.ptok') || '';
function tmTheme(on) { document.body.classList.toggle('tmode', !!on); }
function tmN(v) { const n = Number(v); return isFinite(n) ? n : 0; }
function tmEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function tmName(id) { try { const m = (DB.members || []).find(x => x.id === id); return m ? m.name : (id || ''); } catch (e) { return id || ''; } }
function tmRe() { if (tab !== 'tournament' || !DB) return; __rCache.tab = null; $('#view').innerHTML = vTournament(); tmBind(); if (TS.view === 'hof') hofBind(); }
function tmReSub() { TS.sub = TS.sub || 'home'; tmRe(); }

/* ---------------- 데이터 로드 ---------------- */
function tmLoadPayload() {
  if (TS.loading) return; TS.loading = true; TS.err = '';
  api('getTournamentPayload', PW).then(d => {
    TS.loading = false; TS.list = d.list || []; TS.total = d.total || 0; TS.hofCount = d.hof || 0;
    if (!TS.tid && TS.list.length) TS.tid = TS.list[0].tournamentId;
    if (TS.tid) tmLoadOne(TS.tid); else tmRe();
  }).catch(e => { TS.loading = false; TS.err = errMsg(e); tmRe(); });
}
function tmLoadOne(tid) {
  TS.tid = tid; TS.cur = null; TS.sub = 'home'; TS.view = 'detail'; TS.err = '';
  TS.board = TS.players = TS.holes = TS.rules = TS.prizes = TS.cands = TS.special = TS.result = TS.audit = null;
  api('getTournament', PW, tid).then(d => { TS.cur = d; return api('getTournamentBoard', PW, tid); })
    .then(bd => { TS.board = bd; tmRe(); return tmLoadSub(); })
    .catch(e => { TS.err = errMsg(e); tmRe(); });
}
function tmLoadSub() {
  const tid = TS.tid, jobs = [];
  if (DB && DB.isAdmin) {
    jobs.push(api('getTournamentPlayers', PW, tid).then(d => TS.players = d).catch(e => { TS.err = errMsg(e); }));
    jobs.push(api('getSpecialHoles', PW, tid).then(d => TS.holes = d).catch(() => { }));
    jobs.push(api('getAwardRules', PW, tid).then(d => TS.rules = d).catch(() => { }));
    jobs.push(api('getPrizes', PW, tid).then(d => TS.prizes = d).catch(() => { }));
    jobs.push(api('getAwardCandidates', PW, tid).then(d => TS.cands = d).catch(() => { }));
    jobs.push(api('getTournamentAudit', PW, tid).then(d => TS.audit = d).catch(() => { }));
  }
  jobs.push(api('getSpecialRecords', PW, tid, TM_PTOK()).then(d => TS.special = d).catch(() => { }));
  jobs.push(api('getTournamentResult', PW, tid).then(d => TS.result = d).catch(() => { }));
  return Promise.all(jobs).then(tmRe);
}
function tmLoadHof() {
  TS.view = 'hof'; HS.sub = 'home'; HS.tid = ''; HS.year = ''; HS.type = ''; HS.err = ''; tmRe();
  hofLoad();

/* ---------------- 이벤트 바인딩 ---------------- */
function tmBind() {
  const q = (s, r) => (r || document).querySelector(s);
  const qa = (s, r) => [...(r || document).querySelectorAll(s)];
  document.querySelectorAll('nav button').forEach(b => {
    if (b.dataset.tab === 'tournament') { b.onclick = () => { tab = 'tournament'; render(); }; }
    else if (!b.dataset.tmHook) { b.dataset.tmHook = '1'; b.addEventListener('click', () => tmTheme(false)); }
  });
  qa('[data-tmt]').forEach(e => e.onclick = () => tmLoadOne(e.dataset.tmt));
  qa('[data-tmnew]').forEach(e => e.onclick = () => { TS.view = 'new'; TS.cur = TS.cur; tmRe(); });
  qa('[data-tmedit]').forEach(e => e.onclick = () => { TS.view = 'new'; tmRe(); });
  qa('[data-tmlist]').forEach(e => e.onclick = () => { TS.view = 'list'; TS.cur = null; tmRe(); });
  qa('[data-tmhof]').forEach(e => e.onclick = () => tmLoadHof());
  qa('[data-tmreload]').forEach(e => e.onclick = () => { if (TS.tid) tmLoadOne(TS.tid); else tmLoadPayload(); });
  qa('[data-tmsub]').forEach(e => e.onclick = () => { TS.sub = e.dataset.tmsub; TS.pre = null; tmRe(); });
  qa('[data-tmgo]').forEach(e => e.onclick = () => {
    const s = e.dataset.tmgo;
    tmAct(api('setTournamentStatus', PW, TS.tid, s, ''), '상태를 ' + s + '로 변경했습니다').then(() => tmLoadOne(TS.tid));
  });
  qa('[data-tmst]').forEach(e => e.onclick = () => {
    const s = e.dataset.tmst, t = TS.cur.tournament;
    if (s === t.status) return;
    const back = ['시상확정', '완료'].indexOf(t.status) >= 0;
    if (s === '시상확정') return toast('시상 확정은 [후보·확정] 탭의 [시상 확정] 버튼을 사용하세요', 5000);
    if (!confirm('대회 상태를 "' + s + '"(으)로 변경할까요?')) return;
    let reason = '';
    if (back) { reason = prompt('확정된 대회를 되돌립니다. 사유를 입력하세요:') || ''; if (!reason) return; }
    tmAct(api('setTournamentStatus', PW, TS.tid, s, reason), '상태: ' + s).then(() => tmLoadOne(TS.tid));
  });
  const ruleSave = q('[data-tmrulesave]');
  if (ruleSave) ruleSave.onclick = () => {
    const g = k => { const e = q('[data-tmrule="' + k + '"]'); return e ? e.value : undefined; };
    tmAct(api('setEligibleRounds', PW, TS.tid, {
      attendanceFrom: g('attendanceFrom'), attendanceTo: g('attendanceTo'),
      bonusApply: g('bonusApply') === 'true', bonusMax: +g('bonusMax'), minAttendance: +g('minAttendance')
    }), '참석률 기준을 저장하고 재계산했습니다').then(() => tmLoadSub());
  };
  const hcpAll = q('[data-tmhcpall]');
  if (hcpAll) hcpAll.onclick = () => {
    if (!confirm('모든 참가자의 대회핸디를 공식핸디+보너스로 확정할까요?\n(개별 수동 지정값은 유지됩니다)')) return;
    tmAct(api('approveAllTournamentHandicap', PW, TS.tid, '관리자 일괄 확정'), '전원 확정했습니다').then(() => tmLoadSub());
  };
  qa('[data-tmhcpsave]').forEach(e => e.onclick = () => {

function hofIconOf(type) {
  return ({ net: 'i-trophy', gross: 'i-ball', near: 'i-pin', long: 'i-drive', attendance: 'i-cal', special: 'i-crown', record: 'i-scroll', manual: 'i-laurel' })[type] || 'i-crown';
}

/* ---------------- 로드 ---------------- */
function hofLoad() {
  HS.loading = true; HS.err = ''; HS.idx = null;
  return api('getHofIndex', PW).then(d => {
    HS.loading = false; HS.idx = d;
    const list = d.list || [];
    if (!list.length) { tmRe(); return; }
    const hit = list.filter(hofMatch)[0] || list[0];
    return hofOpen(hit.tournamentId);
  }).catch(e => { HS.loading = false; HS.err = errMsg(e); tmRe(); });
}
function hofOpen(tid) {
  if (!tid) return Promise.resolve();
  HS.tid = tid; HS.board = null; HS.err = ''; HS.set = null; HS.aud = null; tmRe();
  if (HS.setOpen) hofLoadSettings();
  if (HS.audOpen) hofLoadAudit();
  return api('getHofBoard', PW, tid).then(d => { HS.board = d; tmRe(); })
    .catch(e => { HS.err = errMsg(e); tmRe(); });
}
function hofFiltered() {
  const list = (HS.idx && HS.idx.list) || [];
  return list.filter(t => (!HS.year || String(t.date || '').slice(0, 4) === HS.year) && (!HS.type || t.type === HS.type));
}
function hofMatch(t) { return (!HS.year || String(t.date || '').slice(0, 4) === HS.year) && (!HS.type || t.type === HS.type); }
function hofPick() {
  const list = hofFiltered(), hit = list[0];
  if (hit && hit.tournamentId !== HS.tid) return hofOpen(hit.tournamentId);
  tmRe();
}

/* ---------------- 화면 ---------------- */
function hofView() {
  hofSprite();
  let h = '<div class="hofwrap">' + hofHero();
  h += '<div class="hf-adminbar"><button class="hf-btn" data-tmlist="1">← 대회 목록</button>';
  if (HS.idx && HS.idx.isAdmin && HS.tid) h += '<button class="hf-btn" data-hfset="1">' + (HS.setOpen ? '설정 닫기' : '전당 설정') + '</button><button class="hf-btn" data-hfaud="1">' + (HS.audOpen ? '감사 닫기' : '감사 기록') + '</button>';
  h += '</div>';
  h += hofTabs();
  if (HS.setOpen) h += hofSettingsPanel();
  if (HS.audOpen) h += hofAuditPanel();
  if (HS.err) h += `<div class="hf-blk">${hofEsc(HS.err)}</div>`;
  if (!HS.idx) return h + '<div class="hf-load">전당 정보를 불러오는 중…</div></div>';
  const list = HS.idx.list || [];
  if (!list.length) {
    return h + hofEmpty('아직 전당 기록이 없습니다', '관리자가 대회 시상을 확정하면 이곳에 시상대와 수상 기록이 나타납니다.') + hofFoot() + '</div>';
  }
  h += hofFilters();
  if (HS.sub === 'home') h += hofHome();
  else if (HS.sub === 'events') h += hofEvents();
  else if (HS.sub === 'photos') h += hofPhotos();
  else if (HS.sub === 'records') h += hofRecords();
  else if (HS.sub === 'members') h += hofMembers();
  else h += hofSoon(HS.sub);
  h += hofFoot();
  return h + '</div>';
}
function hofHero() {

function hofTabs() {

function hofFilters() {
  const idx = HS.idx || {}, years = idx.years || [], types = idx.types || [], list = hofFiltered();
  let h = '<div class="hf-filters">';
  h += `<select data-hfyear="1" aria-label="연도"><option value="">전체 연도</option>` +
    years.map(y => `<option value="${hofEsc(y.year)}" ${HS.year === y.year ? 'selected' : ''}>${hofEsc(y.year)}년 (${tmN(y.n)})</option>`).join('') + '</select>';
  h += `<select data-hftype="1" aria-label="대회 유형"><option value="">전체 유형</option>` +
    types.map(t => `<option value="${hofEsc(t.type)}" ${HS.type === t.type ? 'selected' : ''}>${hofEsc(t.type)} (${tmN(t.n)})</option>`).join('') + '</select>';
  h += `<select data-hft="1" aria-label="대회명">` +
    (list.length ? list.map(t => `<option value="${hofEsc(t.tournamentId)}" ${HS.tid === t.tournamentId ? 'selected' : ''}>${hofEsc(t.name)}</option>`).join('') : '<option value="">해당 대회 없음</option>') + '</select>';
  h += '<span class="hf-pills">';
  h += `<span class="hf-pill">${hofIcon('i-check')}공개 <b>${tmN((idx.list || []).length)}</b></span>`;
  if (HS.board && HS.board.preview) h += `<span class="hf-pill">${hofIcon('i-lock')}관리자 미리보기</span>`;
  const pend = (idx.list || []).filter(t => t.published === false).length;
  if (idx.isAdmin && pend) h += `<span class="hf-pill">${hofIcon('i-lock')}미공개 <b>${tmN(pend)}</b></span>`;
  h += '</span></div>';
  return h;
}
function hofHome() {
  if (!HS.board) return '<div class="hf-load">전당 기록을 불러오는 중…</div>';
  const b = HS.board;
  if (!b.public) {
    const pz = b.publish || {};
    if (pz.reason === 'not-confirmed') return hofEmpty('시상 확정 전입니다', '관리자가 시상을 확정하면 시상대와 수상 기록이 이곳에 표시됩니다.');
    if (pz.reason === 'scheduled') return hofEmpty('예약 공개 대기 중입니다', (pz.scheduledAt ? pz.scheduledAt + ' 부터 회원에게 공개됩니다.' : '공개 일시가 지나면 자동으로 공개됩니다.'));
    return hofEmpty('관리자 승인 대기 중입니다', '관리자가 공개를 승인하면 이 대회의 시상대가 회원에게 표시됩니다.');
  }
  let h = '';
  const pb = b.publish || {};
  if (b.preview) h += `<div class="hf-warn">${hofIcon('i-lock')}관리자 미리보기 — 회원에게는 아직 공개되지 않았습니다.</div>`;
  if (b.isAdmin && pb.canApprove) h += '<div class="hf-pubbar">' + hofIcon('i-lock') + '<span><b>' + (pb.public ? '공개 중' : '미공개') + '</b> · 승인 방식 — 회원 열람은 관리자 승인으로 결정됩니다.</span><button class="hf-btn" data-hfpub="' + (pb.public ? '0' : '1') + '">' + (pb.public ? '공개 철회' : '공개 승인') + '</button></div>';
  if (b.isAdmin && pb.mode === 'scheduled' && pb.scheduledAt) h += `<div class="hf-warn">${hofIcon('i-cal')}예약 공개 — <b>${hofEsc(pb.scheduledAt)}</b> 부터 회원에게 공개됩니다.</div>`;
  h += '<div class="hf-stage"><span class="hf-spot" aria-hidden="true"></span><span class="hf-beam" aria-hidden="true"></span><span class="hf-floor" aria-hidden="true"></span>';

  h += hofPodiumHtml(b.podium);
  h += hofPlaque(b);

  h += hofCols(b);   /* 특별상 카드 섹션은 제거 (요청) */

}

  const i = b.info || {}, s = b.settings || {};

function hofFigure(rank, face) {
  const tc = rank === 1 ? '#E8C877' : rank === 2 ? '#C0C0C0' : '#CD7F32';
  return '<div class="hf-fig">'
    + (rank === 1 ? '<svg class="fcr" viewBox="0 0 64 46" aria-hidden="true"><use href="#i-crown"/></svg>' : '')
    + '<span class="cp"></span>'
    + '<div class="hd"><div class="fc">' + hofFaceInner(face) + '</div></div>'
    + '<div class="tr"></div>'
    + (rank === 1 ? '<span class="sash"></span>' : '')
    + '<div class="am l"><span class="hand"></span></div>'
    + '<div class="am r"><span class="hand"></span><svg class="tpy" viewBox="0 0 30 34" style="color:' + tc + '"><use href="#i-trophy"/></svg></div>'
    + '<div class="bl"></div>'
    + '<div class="lg"><span></span><span></span></div>'

}
function hofPodiumHtml(pd) {
  const list = (pd && pd.list) || [];
  if (!list.length) return '<div class="hf-empty">아직 시상 확정된 결과가 없습니다. 관리자가 시상을 확정하면 시상대가 나타납니다.</div>';
  const adm = !!(HS.board && HS.board.isAdmin);
  const by = {};
  list.forEach(x => { by[tmN(x.pos || x.rank)] = x; });
  const order = [2, 1, 3, 4, 5].filter(r => by[r]);
  const slotCls = r => r === 1 ? 'gold' : r === 2 ? 'silver' : 'bronze';
  const pedCls = r => r === 1 ? 'g' : r === 2 ? 's' : 'b';
  const eng = r => r === 1 ? 'Champion' : r === 2 ? 'Runner-up' : r === 3 ? 'Third' : r + 'th';
  const rc = r => r === 1 ? 'rgba(232,200,119,.7)' : r === 2 ? 'rgba(192,192,192,.55)' : 'rgba(205,127,50,.6)';
  let h = '<div class="hf-podium">';
  /* 단상 높이는 1위 > 2위 > 3위, 세 단상은 같은 바닥선에 서고
     이름·기록은 높이가 고정된 정보 영역에 놓여 세 자리가 같은 줄에 정렬된다. */
  order.forEach(r => {
    const x = by[r];
    h += `<div class="hf-slot ${slotCls(r)}">`;
    h += hofFigure(r, x.face);
    h += `<div class="hf-ped ${pedCls(r)}">`;
    if (r === 1) h += '<svg class="wr" viewBox="0 0 90 90" aria-hidden="true"><g fill="none" stroke="rgba(10,26,21,.28)" stroke-width="2"><path d="M45 80C26 80 10 64 10 42"/><path d="M45 80c19 0 35-16 35-38"/></g></svg>';
    h += `<span class="rk">${r}</span><span class="eng">${eng(r)}</span></div>`;
    h += '<div class="hf-info">';
    h += `<p class="hf-nm">${hofEsc(x.memberName)}</p>`;   /* 시상대 인물에는 상품명 미표기 */
    h += `<p class="hf-scr">${hofEsc(x.unit || '')} <b>${hofEsc(x.score)}</b></p>`;
    h += `<span class="hf-chip">${eng(r)}</span>`;
    h += `<span class="hfc-tie">${x.tie ? '공동 순위' : ''}</span>`;
    h += '</div>';
    h += `<span class="hf-refl" style="--rc:${rc(r)}"></span></div>`;
  });
  return '<div class="hf-podwrap">' + h + '</div>' + hofPickBar(adm ? HS.board : null);
}
/* 공동 순위 지정 — 시상대 밖 별도 바 (관리자 전용) */
function hofPickBar(b) {
  if (!b || !b.isAdmin) return '';
  const slots = ((b.podium || {}).list || []).filter(x => x.cands && x.cands.length > 1);
  if (!slots.length) return '';
  let h = '<div class="hf-pickbar"><span class="lb">공동 순위 지정</span>';
  slots.forEach(x => {
    h += `<label class="it"><b>${tmN(x.pos)}위</b><select data-hfpick="${tmN(x.pos)}"><option value="">기본 순서</option>`;
    x.cands.forEach(c => {
      const sc = ((c.unit || '') + ' ' + (c.score === '' || c.score == null ? '' : c.score)).trim();
      const hc = (c.hc === '' || c.hc == null) ? '' : '핸디 ' + c.hc;
      h += `<option value="${hofEsc(c.memberId)}"${(x.pick && c.memberId === x.memberId) ? ' selected' : ''}>${hofEsc(c.memberName)}${sc ? ' · ' + hofEsc(sc) : ''}${hc ? ' · ' + hofEsc(hc) : ''}</option>`;
    });
    h += '</select></label>';
  });
  return h + '</div>';
}

/** 역대 대회 탭 — 선택한 대회의 특별상 카드 + 전체 시상 결과 (시상대 홈에서는 요청대로 제외) */

function hofMediaResize(file, max, cb) {
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const sc = Math.min(1, max / Math.max(im.width, im.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(im.width * sc)); cv.height = Math.max(1, Math.round(im.height * sc));
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => cb(null);
    im.src = rd.result;
  };
  rd.onerror = () => cb(null);
  rd.readAsDataURL(file);
}

  if (b.public) h += `<span class="hf-badge ok">${hofIcon('i-check', 'font-size:12px')}시상 확정 ${hofEsc(String(i.confirmedAt || '').slice(0, 10))}</span>`;
  if (b.public && i.publishedAt) h += `<span class="hf-badge ok">${hofIcon('i-check', 'font-size:12px')}공개 ${hofEsc(i.publishedAt)}</span>`;
  if (b.preview) h += `<span class="hf-badge">${hofIcon('i-lock', 'font-size:12px')}미공개 (관리자 미리보기)</span>`;
  h += '<span class="dsc">확정 전에는 관리자 미리보기만 가능하며, 회원에게는 공개 승인 후 표시됩니다. 얼굴 사진은 동의한 회원만 표시되고, 미등록 회원은 기본 실루엣으로 대체됩니다.</span>';
  return h + '</div>';
}
function hofBind() {
  const qa = s => Array.from(document.querySelectorAll(s));
  qa('[data-hfsub]').forEach(e => e.onclick = () => { HS.sub = e.dataset.hfsub; tmRe(); });
  qa('[data-hfm]').forEach(e => e.onclick = () => hofMediaView(e.dataset.hfm));
  qa('[data-hfmdel]').forEach(e => e.onclick = ev => { ev.stopPropagation(); hofMediaDel(e.dataset.hfmdel); });
  const hfmA = $('#hfmAdd'); if (hfmA) hfmA.onclick = () => hofMediaAdd();
  const hpBtn = qa('[data-hfpub]')[0];
  if (hpBtn) hpBtn.onclick = () => hofPublish(hpBtn.dataset.hfpub === '1');
  const y = qa('[data-hfyear]')[0];
  if (y) y.onchange = () => { HS.year = y.value; HS.tid = ''; HS.rec = null; HS.mem = null; HS.memSel = ''; tmRe(); hofPick(); };
  const ty = qa('[data-hftype]')[0];
  if (ty) ty.onchange = () => { HS.type = ty.value; HS.tid = ''; HS.rec = null; HS.mem = null; HS.memSel = ''; tmRe(); hofPick(); };
  const t = qa('[data-hft]')[0];
  if (t) t.onchange = () => hofOpen(t.value);
  qa('[data-hfe]').forEach(e => e.onclick = () => { HS.sub = 'home'; hofOpen(e.dataset.hfe); });
  qa('[data-hfpick]').forEach(e => e.onchange = () => hofSetPick(tmN(e.dataset.hfpick), e.value));
  qa('[data-hfmem]').forEach(e => e.onclick = () => hofLoadMember(e.dataset.hfmem));
  const sb = qa('[data-hfset]')[0];
  if (sb) sb.onclick = () => hofSetToggle();
  const ab = qa('[data-hfaud]')[0];
  if (ab) ab.onclick = () => hofAudToggle();
  const sv = $('#hfsSave');
  if (sv) sv.onclick = () => hofSaveSettings();
  const mb = qa('[data-hfmb]')[0];
  if (mb) mb.onclick = () => { HS.memSel = ''; HS.mem = null; tmRe(); };
  /* 사진 등록/수정 버튼 (M2 — 연결 누락 수정) */
}
function hofSetPick(pos, mid) {
  if (!HS.tid) return;
  busy(true);
  api('saveHofPodiumPick', PW, HS.tid, pos, mid || '').then(d => {
    HS.board = d; busy(false); toast(mid ? '시상대 순위를 지정했습니다' : '기본 순서로 되돌렸습니다'); tmRe();
  }).catch(e => { busy(false); toast(errMsg(e)); });
}

/* =====================================================================
   M2 : 회원 얼굴 사진 — 등록/자르기/동의 UI (캔버스 편집기)
   ===================================================================== */
function hofPublish(on) {
  const tid = HS.tid; if (!tid) return;
  busy(true);
  api('hofSetPublish', PW, tid, !!on, on ? '화면에서 공개 승인' : '화면에서 공개 철회')
    .then(d => { busy(false); HS.board = d.board || HS.board; toast(on ? '회원에게 공개했습니다' : '공개를 철회했습니다'); tmRe(); })
    .catch(e => { busy(false); toast(errMsg(e), 5000); });
}
function hofSubs() {
  const s = HOF_SUBS.slice();
  return s;
}


</script>
