function psLoadHole(){PS.shots=(PS.holes[PS.hole+1]||[]).filter(function(s){return s.type!=='PUTT'}).map(function(s){return{club:s.club||'',dist:s.dist||'',res:s.res||'',pen:s.pen||0}});if(!PS.shots.length)PS.shots=[{club:'',dist:'',res:'',pen:0}];const p=(PS.holes[PS.hole+1]||[]).find(function(s){return s.type==='PUTT'});PS.putts=p?p.putts:'';}
function psRender(){
  const par=PS.pars[PS.hole]||4,has=function(i){return (PS.holes[i+1]||[]).length>0};
  const nav=`<div class="se-nav"><button data-ps="nav|-1" ${PS.hole?'':'disabled'}>◀</button><div><b>HOLE ${PS.hole+1}</b><span>PAR ${par} · ${esc(PS.date||'')}</span></div><button data-ps="nav|1" ${PS.hole<17?'':'disabled'}>▶</button></div>
   <div class="se-holes">${PS.pars.map(function(p,i){return `<button data-ps="hole|${i}" class="${i===PS.hole?'cur':has(i)?'done':''}">${i+1}</button>`}).join('')}</div>`;
  const body=PS.shots.map(function(s,i){
    const clubs=(i===0&&par>=4)?SC_TEE:SC_ALL, ress=(i===0&&par>=4)?SR_TEE:SR_ALL;
    return `<div class="se-shot"><div class="se-h"><b>SHOT ${i+1}</b>${PS.shots.length>1?`<button class="x" data-ps="del|${i}">✕</button>`:''}</div>

     <div class="se-row"><span>결과</span><select data-ps="res|${i}">${[''].concat(ress).map(function(c){return `<option value="${c}" ${s.res===c?'selected':''}>${c||'선택'}</option>`}).join('')}</select></div>
     <div class="se-row"><span>벌타</span><input type="number" inputmode="numeric" data-ps="pen|${i}" value="${s.pen||0}" min="0" max="3"></div></div>`;
  }).join('');
  openDlg((PS.club?PS.club+' · ':'')+'샷 기록',`${nav}${body}
   <div style="display:flex;gap:8px;margin:8px 0"><button class="btn ghost mini" data-ps="add">+ 샷 추가</button><span style="flex:1"></span><span class="note" style="align-self:center">퍼트</span><input type="number" inputmode="numeric" id="psPutt" value="${PS.putts==null?'':PS.putts}" min="0" max="10" style="width:70px"></div>
   <div style="display:flex;gap:8px;margin-top:6px"><button class="btn ghost" data-ps="close">닫기</button><span style="flex:1"></span><button class="btn" data-ps="save">저장</button></div>
   <p class="note" style="margin:10px 0 0">샷을 입력하면 이 라운드의 샷 분석(드라이버 평균·퍼트·벌타)에 반영됩니다. 홀마다 따로 저장됩니다.</p>`);
  document.querySelectorAll('#dlgBody [data-ps]').forEach(function(el){
    const a=el.dataset.ps.split('|'),k=a[0],i=+a[1];
    if(k==='club'||k==='dist'||k==='res'||k==='pen'){el.onchange=el.oninput=function(){PS.shots[i][k==='dist'?'dist':k==='res'?'res':k==='pen'?'pen':'club']=el.value;PS.dirty=true};return}
    el.onclick=function(){
      if(k==='nav'){if(PS.dirty&&!confirm('저장하지 않은 샷이 있습니다. 이동할까요?'))return;PS.hole=Math.max(0,Math.min(17,PS.hole+i));psLoadHole();psRender();return}
      if(k==='hole'){if(PS.dirty&&!confirm('저장하지 않은 샷이 있습니다. 이동할까요?'))return;PS.hole=i;psLoadHole();psRender();return}
      if(k==='add'){PS.shots.push({club:'',dist:'',res:'',pen:0});psRender();return}
      if(k==='del'){PS.shots.splice(i,1);if(!PS.shots.length)PS.shots=[{club:'',dist:'',res:'',pen:0}];psRender();return}
      if(k==='close'){dlgClose();return}
      if(k==='save'){
        const pv=$('#psPutt')?$('#psPutt').value:'';
        const shots=PS.shots.filter(function(s){return s.club||s.dist||s.res}).map(function(s){return{club:s.club,before:null,dist:s.dist===''?null:+s.dist,dir:'',res:s.res,miss:'',pen:+s.pen||0}});

          busy(false);PS.holes=d.holes||{};PS.dirty=false;toast((PS.hole+1)+'번 홀 샷 기록을 저장했습니다');psRender();psMyStat();
        }).catch(function(e){busy(false);toast(errMsg(e),6000)});
      }
    };
  });
}

let PRLM='board',PRLH=0,PRLD={},PRLST='자동 저장';
function prLive(prId){
  PRLM='board';PRLD={};PRLST='자동 저장';
  api('getPersonalRoundLive',ptokS(),prId).then(function(d){PRL=d;PRLH=prNextHole();prLiveRender()}).catch(function(e){toast(errMsg(e),6000)});

function prLivePlayers(){
  const ps=(PRL&&PRL.players)||[];
  return ps.length?ps:[{id:'',name:'나',isMe:true,holes:(PRL&&PRL.holes)||[]}];
}
function prParsOf(){return String((PRL&&PRL.round&&PRL.round.pars)||'').split(',').map(function(x){return Number(x)||4})}
function prRowsOf(){
  const pars=prParsOf();
  return prLivePlayers().map(function(p){
    const h=Array.from({length:18},function(_,i){const x=(p.holes||[]).filter(function(y){return Number(y.holeNo)===i+1})[0];return x&&x.score!=null?Number(x.score):null});
    let thru=0,toPar=0,gross=0;
    h.forEach(function(v,i){if(v==null)return;thru++;gross+=v;toPar+=v-pars[i]});
    return {p:p,id:String(p.id||''),name:p.name||'나',isMe:!!p.isMe,h:h,thru:thru,gross:gross,toPar:toPar};
  });
}
function prNextHole(){
  const rows=prRowsOf();if(!rows.length)return 0;
  let m=18;rows.forEach(function(r){r.h.forEach(function(v,i){if(v==null&&i<m)m=i})});
  return m>=18?0:m;
}
function prBoardHtml(rows,pars){
  const st=rows.slice().sort(function(a,b){if(!a.thru)return 1;if(!b.thru)return -1;return a.toPar-b.toPar||b.thru-a.thru});
  let prev=null,k=0;
  st.forEach(function(x,i){if(!x.thru){x.rank=null;return}if(x.toPar!==prev){k=i+1;prev=x.toPar}x.rank=k});
  return `<div class="toolbar"><h2 style="font-size:16px">전체 순위 <small style="color:var(--muted);font-weight:500">${rows.filter(function(x){return x.thru}).length}/${rows.length}명 진행</small></h2></div>
  <div class="scroll"><table class="board"><thead><tr><th>순위</th><th class="l">이름</th><th>그로스</th><th>파 대비</th><th>홀</th></tr></thead><tbody>
  ${st.map(function(x){return `<tr class="${x.isMe?'me':''}"><td>${x.rank?`<span class="tile rank">${x.rank}</span>`:'–'}</td><td class="l"><b class="nmb" data-plshot="${x.isMe?'1':''}">${esc(x.name)}</b>${x.isMe?' <span class="chip gold">나</span>':''}</td><td class="n">${x.thru?x.gross:'–'}</td><td><span class="topar ${tpc(x.toPar)}">${tp(x.toPar)}</span></td><td class="thru">${x.thru===18?'F':(x.thru||'–')}</td></tr>`}).join('')}
  </tbody></table></div>
  <p class="note">파 대비 = 홀별 (타수 − 파)의 합계입니다. 내 이름을 누르면 샷 기록을 볼 수 있습니다. 진행 중에는 20초마다 자동 갱신됩니다.</p>`;
}
function scoreCardHtml(list,pars,title,sub){
  const nine=function(s,name){
    const idx=Array.from({length:9},function(_,i){return i+s});
    const outPar=idx.reduce(function(a,i){return a+(pars[i]||4)},0);
    const body=list.map(function(x){
      const cells=idx.map(function(i){
        const y=x.h[i];if(y==null)return '<td><span class="v">&nbsp;</span></td>';
        const d=y-pars[i];const cls=d<=-1?'b':d>=3?'db':d===2?'bg':'';
        return `<td><span class="v ${cls}">${y}</span></td>`;
      }).join('');
      const sum=idx.reduce(function(a,i){return a+(x.h[i]||0)},0);
      return `<tr><td class="nm">${esc(x.name)}</td>${cells}<td><span class="v tot">${sum||''}</span></td></tr>`;
    }).join('');
    return `<div class="nine"><div class="nine-h"><b>${name}</b><span>파 ${outPar}</span></div>
      <table class="sc2"><tr><th class="nm">홀</th>${idx.map(function(i){return `<th>${i+1}</th>`}).join('')}<th>계</th></tr>
      <tr class="par"><td class="nm">파</td>${idx.map(function(i){return `<td><span class="v parv">${pars[i]||4}</span></td>`}).join('')}<td><span class="v par v">${outPar}</span></td></tr>
      ${body}</table></div>`;
  };
  return `<div class="prcard">
    <div class="prcard-h"><b>${esc(title)}</b><small>${sub}</small></div>
    ${nine(0,'전반 9홀')}
    ${nine(9,'후반 9홀')}
    <div class="prcard-sum">${list.map(function(x){return `<span><b>${esc(x.name)}</b><i class="topar ${tpc(x.toPar)}">${tp(x.toPar)}</i><small>${x.thru?x.gross+'타':'기록 전'}</small></span>`}).join('')}</div>
    <div class="prcard-f"><div class="lg"><span><i style="background:#E5EFFA"></i>버디 이하</span><span><i style="background:#FBE9EB"></i>더블보기</span><span><i style="background:#F6E3C6"></i>트리플 이상</span><span style="margin-left:auto">합계는 입력된 홀만</span></div></div>
  </div>`;
}
function prCardHtml(rows,pars){
  const th=rows.length?Math.min.apply(null,rows.map(function(x){return x.thru})):0;
  const played=rows.filter(function(x){return x.thru}).slice().sort(function(a,b){return a.toPar-b.toPar});
  let lead='';
  if(played.length>1){const gap=Math.round((played[1].toPar-played[0].toPar)*10)/10;lead=gap<=1?(gap===0?'동타 접전':'1타 차 접전'):esc(played[0].name)+' 선두'}
  else if(played.length===1) lead=esc(played[0].name)+' 선두';
  const sub=(th===18?'18홀 완료':th?th+'홀 진행 중':'대기')+(lead?' · '+lead:'');
  return scoreCardHtml(rows,pars,(PRL&&PRL.round&&PRL.round.clubName)||'개인 라운딩',sub);
}

function prInputHtml(rows,pars){
  const list=rows,cur=PRLH,par=pars[cur]||4;
  const done=function(i){return list.every(function(x){return x.h[i]!=null})};
  return `<div class="toolbar"><h2 style="font-size:16px">스코어 입력</h2><span class="note" id="plSaveState">${esc(PRLST)}</span></div>
  <div class="holebar">${pars.map(function(p,i){return `<button data-plh="${i}" class="${i===cur?'cur':done(i)?'done':''}" aria-label="${i+1}번 홀">${i+1}</button>`}).join('')}</div>
  <div class="card" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;padding:12px 16px"><div><b style="font-family:var(--num);font-size:30px">${cur+1}번 홀</b> <span style="color:var(--muted)">파 ${par}</span></div>
   <button class="btn ghost" id="plAllPar" style="padding:5px 10px">모두 파</button></div>
  ${list.map(function(x){const key=x.id+'|'+(cur+1);const has=PRLD[key]!==undefined;const v=has?PRLD[key]:x.h[cur];const d=v==null?null:v-par;
    return `<div class="pl"><div class="who"><b>${esc(x.name)}</b><span>현재 ${tp(x.toPar)} · ${x.thru}홀</span></div>
    <div class="stepper"><button data-pls="${key}" data-d="-1" aria-label="${esc(x.name)} 한 타 줄이기">−</button><output class="${v==null?'empty':''}" data-plo="${key}">${v==null?par:v}</output><button data-pls="${key}" data-d="1" aria-label="${esc(x.name)} 한 타 늘리기">+</button></div>
    <div style="width:44px;text-align:center" class="topar ${tpc(d)}">${d==null?'':tp(d)}</div></div>`}).join('')}
  <div class="sticky-save"><button class="btn" id="plSaveHole" style="width:100%;padding:14px;font-size:16px">${cur+1}번 홀 저장${cur<17?' → 다음 홀':''}</button></div>
  <p class="note">회색 숫자는 아직 입력 전(파 기준)입니다. −/+ 로 조정하고 저장하면 동반자 기록까지 함께 저장됩니다.</p>`;
}
function prSaveHole(){
  const pars=prParsOf(),rows=prRowsOf(),h=PRLH+1,par=pars[PRLH]||4;
  const jobs=rows.map(function(x){const key=x.id+'|'+h;const v=(PRLD[key]!==undefined)?PRLD[key]:x.h[PRLH];return {playerId:x.id,score:(v==null?'':v)}});
  const prev=jobs.map(function(j){return {playerId:j.playerId,score:(function(){const p=prLivePlayers().filter(function(x){return String(x.id||'')===j.playerId})[0];return p?((p.holes||[]).filter(function(y){return Number(y.holeNo)===h})[0]||{}).score:null})()}});
  const apply=function(js){js.forEach(function(j){const p=prLivePlayers().filter(function(x){return String(x.id||'')===j.playerId})[0];if(!p)return;
    const row=(p.holes||[]).filter(function(y){return Number(y.holeNo)===h})[0];const val=(j.score===''||j.score==null)?null:Number(j.score);
    if(row)row.score=val;else (p.holes=p.holes||[]).push({holeNo:h,par:par,score:val,putts:null})})};
  const t0=Date.now();
  apply(jobs);PRLD={};PRLST='저장 중…';if(h<18)PRLH=h;else PRLH=0;prLiveRender();   // 화면 먼저 반영
  api('savePersonalHoles',ptokS(),PRL.round.prId,h,jobs).then(function(){
    PRLST='저장됨 '+new Date().toTimeString().slice(0,5)+' · '+((Date.now()-t0)/1000).toFixed(1)+'초';

    const hd=$('#plState');if(hd)hd.textContent=PRLST;
  }).catch(function(e){
    apply(prev);PRLST='저장 실패 — 다시 시도';prLiveRender();
    const st=$('#plSaveState');if(st){st.textContent=PRLST;st.style.color='#b23b3b'}
    toast(errMsg(e),6000);
  });
}

function prLiveRender(){

  if(PRLM==='input'){

  }
}

function hcpReviewRender(){
  const box=$('#hrBox');if(!box||!HRD)return;const rs=HRD.reviews||[],pend=rs.filter(r=>r.status==='대기'),done=rs.filter(r=>r.status!=='대기');

let PAD=null,PAV='',PPV=null,PAP=null,PSUG=null;
function partnerCard(){
  return `<div class="card"><h3>👥 동반 라운딩 · 조편성 기록</h3><p class="note" style="margin-top:0">과거 조편성표를 붙여넣어 등록하면 회원별 동반 횟수·TOP 10·최근 미동반 회원을 자동으로 계산합니다. <b>공식 경기 결과는 만들지도, 바꾸지도 않습니다.</b> 조편성을 최종 확정하면 자동으로 누적되고, 정정하면 다시 맞춰집니다.</p>
   <p class="note">등록된 월 <b>${(DB&&DB.partnerMonths)||0}개</b></p>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" id="ptAdm">동반 기록 관리</button><button class="btn ghost" id="ptRecalc">동반 횟수 재계산</button></div></div>`;
}
function partnerAdminOpen(year){

}
function partnerAdminRender(){
  const box=$('#paBox');if(!box||!PAD)return;
  const ms=PAD.months||[];
  const mon=mo=>`<div class="rvw"><div class="hd"><b>${esc(mo.yearMonth)}</b><span class="tag">${mo.members}명</span><span class="tag">${mo.groupList.length}개 조</span><span class="tag auto">${esc(mo.source||'')}</span><span class="dl">${esc(mo.date||'')}</span></div>
   ${mo.groupList.map(g=>`<p class="note" style="margin:6px 0 0"><b>${g.groupNo}조</b> ${g.members.map(m=>`${esc(m.memberName)}<button class="btn ghost mini" data-pdel="${m.rgId}" title="삭제">×</button>`).join(' ')}</p>`).join('')}
   <div class="btns"><button class="btn ghost mini" data-pmdel="${esc(mo.yearMonth)}">이 달 기록 삭제</button></div></div>`;
  box.innerHTML=`<div class="form"><label>연도<input type="number" id="paYear" value="${esc(PAV)}" min="2000" max="2100"></label></div>
   <p class="note" style="margin:8px 0 4px"><b>과거 조편성표 붙여넣기</b> <small>한 줄에 한 조. "3월 1조 김철환 남광희 임두현 심재명" 또는 "2026-03 2조 …" 형식. 같은 달을 다시 등록하면 그 달만 교체됩니다.</small></p>
   <textarea id="paText" rows="6" placeholder="3월 1조 김철환 남광희 임두현 심재명&#10;3월 2조 이병창 성걸 왕규원" style="width:100%"></textarea>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" id="paPrev">붙여넣기 미리보기</button><button class="btn ghost" id="paRecalc2">자동 재계산</button></div>
   <div id="paResult"></div>
   <p class="note" style="margin:16px 0 4px"><b>등록 현황 · ${ms.length}개월 ${PAD.total}건</b></p>
   ${ms.map(mon).join('')||'<p class="note">등록된 동반 기록이 없습니다.</p>'}
   <p class="note">동반 횟수는 조회할 때 계산됩니다(같은 라운드·같은 조 = 1회). 게스트는 동반 회원 집계에서 제외됩니다. 삭제·수정해도 공식 경기 결과(Rounds·Scores·순위)는 바뀌지 않습니다.</p>`;

  box.querySelectorAll('[data-pmdel]').forEach(b=>b.onclick=()=>{if(confirm(b.dataset.pmdel+' 동반 기록을 모두 삭제할까요?\n공식 경기 결과에는 영향이 없습니다.'))partnerMonthDel(b.dataset.pmdel)});
}
function partnerPreviewRun(){
  const t=$('#paText');if(!t)return;const txt=t.value;
  if(!txt.trim())return toast('조편성표를 붙여넣으세요');
  busy(true);
  api('partnerPreview',PW,txt,PAV).then(d=>{
    busy(false);PPV=d;PAP={};
    (d.months||[]).forEach(mo=>{const g={};mo.groups.forEach(mg=>{g[mg.groupNo]={groupNo:mg.groupNo,members:mg.members.map(x=>({name:x.name,memberId:x.memberId||''}))}});
      PAP[mo.yearMonth]={roundId:mo.roundId,groups:Object.keys(g).map(k=>g[k]).sort((a,b)=>a.groupNo-b.groupNo)}});
    partnerPreviewRender();
  }).catch(e=>{busy(false);toast(errMsg(e),7000)});
}
function partnerPreviewRender(){
  const r=$('#paResult');if(!r||!PPV)return;
  const sel=(ym,gi,mi)=>{const m=(PAP[ym].groups[gi].members[mi]||{});return `<select data-pfix="${ym}|${gi}|${mi}" style="max-width:150px"><option value="">— 회원 선택 —</option>${DB.members.map(x=>`<option value="${x.id}" ${x.id===m.memberId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`};
  r.innerHTML=`<p class="note" style="margin:12px 0 4px"><b>미리보기</b> · ${esc(PPV.summary||'')} <small>미매칭 이름은 아래에서 회원을 직접 골라 주세요.</small></p>`
   +((PPV.warnings||[]).length?`<p class="note red">${PPV.warnings.map(w=>esc(w)).join('<br>')}</p>`:'')
   +(PPV.months||[]).map(mo=>{const P=PAP[mo.yearMonth];
     return `<div class="rvw"><div class="hd"><b>${esc(mo.yearMonth)}</b><span class="tag">${mo.members}명</span>
       <span class="tag ${mo.unmatched?'man':'auto'}">미매칭 ${mo.unmatched}</span>
       ${mo.duplicate?`<span class="tag man">중복 ${mo.duplicate}</span>`:''}
       ${mo.existing?`<span class="tag man">기존 ${mo.existing}건 교체</span>`:''}
       <span class="tag ${mo.roundId?'auto':'man'}">${mo.roundId?'라운드 연결됨':'라운드 없음'}</span></div>
      ${P.groups.map(g=>`<p class="note" style="margin:6px 0 0;display:flex;gap:4px;flex-wrap:wrap;align-items:center"><b>${g.groupNo}조</b> ${g.members.map((m,mi)=>m.memberId?`<span class="tag">${esc(m.name)}</span>`:`<span class="red">${esc(m.name)}</span>${sel(mo.yearMonth,g.groupNo-1,mi)}`).join(' ')}</p>`).join('')}
      ${mo.noScore.length?`<p class="note">⚠ 스코어 기록이 없는 참가자: ${mo.noScore.map(x=>esc(x)).join(', ')}</p>`:''}
      ${mo.scoreCount!==mo.members?`<p class="note">⚠ 조 인원 ${mo.members}명 vs 스코어 ${mo.scoreCount}명 — 기록표를 확인해 주세요.</p>`:''}
      <div class="btns"><button class="btn mini" data-pcm="${esc(mo.yearMonth)}">${esc(mo.yearMonth)} 등록${mo.existing?' (교체)':''}</button></div></div>`}).join('');
  r.querySelectorAll('[data-pfix]').forEach(s=>s.onchange=()=>{const [ym,gi,mi]=s.dataset.pfix.split('|');PAP[ym].groups[+gi].members[+mi].memberId=s.value});
  r.querySelectorAll('[data-pcm]').forEach(b=>b.onclick=()=>partnerCommitMonth(b.dataset.pcm));
}
function partnerCommitMonth(ym){
  const P=PAP&&PAP[ym];if(!P)return;
  const items=[],seen={};
  P.groups.forEach(g=>g.members.forEach(m=>{if(!m.memberId)return;const k=g.groupNo+'|'+m.memberId;if(seen[k])return;seen[k]=1;items.push({yearMonth:ym,groupNo:g.groupNo,memberId:m.memberId,source:'기록표'})}));
  if(!items.length)return toast('등록할 회원이 없습니다. 미매칭 이름을 먼저 지정하세요');
  const un=P.groups.reduce((a,g)=>a+g.members.filter(m=>!m.memberId).length,0);
  if(un&&!confirm('미매칭 이름 '+un+'건은 건너뜁니다. '+ym+'을(를) 등록할까요?'))return;
  busy(true);
  api('partnerCommit',PW,items,PAV).then(d=>{busy(false);PAD=d;PPV=null;toast(d.msg||'등록했습니다',6000);partnerAdminRender();if(DB)DB.partnerMonths=d.monthCount}).catch(e=>{busy(false);toast(errMsg(e),7000)});
}
function partnerRowDel(rgId){busy(true);api('partnerRowDelete',PW,[rgId],PAV).then(d=>{busy(false);PAD=d;toast(d.msg||'삭제했습니다');partnerAdminRender()}).catch(e=>{busy(false);toast(errMsg(e),6000)})}
function partnerMonthDel(ym){busy(true);api('partnerMonthDelete',PW,ym).then(d=>{busy(false);PAD=d;toast(d.msg||'삭제했습니다',6000);partnerAdminRender()}).catch(e=>{busy(false);toast(errMsg(e),6000)})}
function partnerRecalcRun(){busy(true);api('partnerRecalc',PW,PAV).then(d=>{busy(false);if($('#paBox')){PAD=d;toast(d.msg||'재계산했습니다',6000);partnerAdminRender()}else{toast(d.msg||'재계산했습니다',6000);load()}}).catch(e=>{busy(false);toast(errMsg(e),6000)})}

/* ---------- 동반 이력 기반 조편성 추천 ---------- */
function partnerSuggestRun(){
  if(!RE||!RE.event)return;
  busy(true);
  api('partnerSuggest',PW,RE.event.eventId).then(d=>{busy(false);PSUG=d;partnerSuggestRender()}).catch(e=>{busy(false);toast(errMsg(e),6000)});
}
function partnerSuggestRender(){
  const d=PSUG;if(!d)return;
  openDlg('👥 동반 이력 기반 조편성 추천',`<p class="note" style="margin-top:0">${esc((d.event||{}).date||'')} ${esc((d.event||{}).name||'')} ${esc((d.event||{}).course||'')} · ${esc(d.pairNote||'')}</p>
   ${(d.warn||[]).map(w=>`<p class="note red">⚠ ${esc(w)}</p>`).join('')}
   ${(d.sections||[]).map(s=>`<p class="note" style="margin:10px 0 4px"><b>${esc(s.name)}</b></p><div class="rec jk">${s.groups.map((g,i)=>`<div style="padding:7px 12px"><b>${i+1}조</b> ${g.map(p=>esc(p.name)+(p.ptype==='게스트'?'(게스트)':'')).join(' · ')}</div>`).join('')}</div>`).join('')||'<p class="note">참석자가 없습니다.</p>'}
   <p class="note">동반 이력이 많은 회원끼리 우선 묶었습니다. [적용]하면 조편성에 반영되고, 저장·최종 확정 후 누적에 반영됩니다.</p>
   <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="psGo">적용</button><span style="flex:1"></span><button class="btn ghost" id="psX">닫기</button></div>`);
  $('#psX').onclick=()=>dlgClose();
  $('#psGo').onclick=()=>partnerSuggestApply();

function partnerSuggestApply(){
  const d=PSUG;if(!d)return;
  const rows=[];let n=0;
  (d.sections||[]).forEach(s=>s.groups.forEach(g=>{n++;g.forEach((p,i)=>rows.push({groupNo:n,teeTime:'',seq:i+1,pid:p.pid,ptype:p.ptype,name:p.name,handicap:p.handicap,pref:p.pref}))}));
  if(!rows.length)return toast('적용할 조편성이 없습니다');
  busy(true);
  api('saveGroups',PW,RE.event.eventId,rows).then(x=>{busy(false);dlgClose();RE=x;toast('동반 이력 기반 조편성을 적용했습니다. 내용을 확인하고 저장하세요',6000);render()}).catch(e=>{busy(false);toast(errMsg(e),6000)});
}

/* =====================================================================
   대회모드(Tournament Mode) — 클라이언트 모듈
   서버: Code.gs 대회모드 모듈 (설계안_3_대회모드.md §Ⅳ)
   원칙: 기존 8개 탭·함수는 건드리지 않고 'tournament' 탭만 추가한다.
   ===================================================================== */
const TM_ST = ['준비', '참가신청', '핸디확정', '경기진행', '기록검증', '시상검토', '시상확정', '완료'];
const TS = {
  list: null, total: 0, hofCount: 0, tid: '', view: 'list', sub: 'home',
  cur: null, board: null, players: null, holes: null, rules: null, prizes: null,
  cands: null, special: null, result: null, audit: null, hof: null, err: '', msg: '', loading: false
};
const TM_PTOK = () => localStorage.getItem('golf.ptok') || '';
function tmTheme(on) { document.body.classList.toggle('tmode', !!on); }
function tmN(v) { const n = Number(v); return isFinite(n) ? n : 0; }
function tmEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function tmName(id) { try { const m = (DB.members || []).find(x => x.id === id); return m ? m.name : (id || ''); } catch (e) { return id || ''; } }
function tmRe() { if (tab !== 'tournament' || !DB) return; __rCache.tab = null; $('#view').innerHTML = vTournament(); tmBind(); if (TS.view === 'hof') hofBind(); }
function tmReSub() { TS.sub = TS.sub || 'home'; tmRe(); }

/* ---------------- 데이터 로드 ---------------- */
function tmLoadPayload() {
  if (TS.loading) return; TS.loading = true; TS.err = '';
  api('getTournamentPayload', PW).then(d => {
    TS.loading = false; TS.list = d.list || []; TS.total = d.total || 0; TS.hofCount = d.hof || 0;
    if (!TS.tid && TS.list.length) TS.tid = TS.list[0].tournamentId;
    if (TS.tid) tmLoadOne(TS.tid); else tmRe();
  }).catch(e => { TS.loading = false; TS.err = errMsg(e); tmRe(); });
}
function tmLoadOne(tid) {
  TS.tid = tid; TS.cur = null; TS.sub = 'home'; TS.view = 'detail'; TS.err = '';
  TS.board = TS.players = TS.holes = TS.rules = TS.prizes = TS.cands = TS.special = TS.result = TS.audit = null;
  api('getTournament', PW, tid).then(d => { TS.cur = d; return api('getTournamentBoard', PW, tid); })
    .then(bd => { TS.board = bd; tmRe(); return tmLoadSub(); })
    .catch(e => { TS.err = errMsg(e); tmRe(); });
}
function tmLoadSub() {
  const tid = TS.tid, jobs = [];
  if (DB && DB.isAdmin) {
    jobs.push(api('getTournamentPlayers', PW, tid).then(d => TS.players = d).catch(e => { TS.err = errMsg(e); }));
    jobs.push(api('getSpecialHoles', PW, tid).then(d => TS.holes = d).catch(() => { }));
    jobs.push(api('getAwardRules', PW, tid).then(d => TS.rules = d).catch(() => { }));
    jobs.push(api('getPrizes', PW, tid).then(d => TS.prizes = d).catch(() => { }));
    jobs.push(api('getAwardCandidates', PW, tid).then(d => TS.cands = d).catch(() => { }));
    jobs.push(api('getTournamentAudit', PW, tid).then(d => TS.audit = d).catch(() => { }));
  }
  jobs.push(api('getSpecialRecords', PW, tid, TM_PTOK()).then(d => TS.special = d).catch(() => { }));
  jobs.push(api('getTournamentResult', PW, tid).then(d => TS.result = d).catch(() => { }));
  return Promise.all(jobs).then(tmRe);
}
function tmLoadHof() {
  TS.view = 'hof'; HS.sub = 'home'; HS.tid = ''; HS.year = ''; HS.type = ''; HS.err = ''; tmRe();
  hofLoad();
}
function tmAct(p, okMsg) { TS.msg = ''; return p.then(d => { if (okMsg) toast(okMsg); return d; }).catch(e => { toast(errMsg(e), 6000); throw e; }); }

/* ---------------- 메인 뷰 ---------------- */
function vTournament() {
  tmTheme(true);
  if (!DB) return '<div class="loading">불러오는 중…</div>';
  if (!TS.list) { tmLoadPayload(); return '<div class="loading">대회 정보를 불러오는 중…</div>'; }
  if (TS.view === 'hof') return tmHofView();
  if (TS.view === 'new') return tmNewForm(TS.cur && TS.cur.tournament);
  if (TS.view === 'detail' && TS.cur) return tmDetailView();
  return tmListView();
}
function tmListView() {
  const admin = !!DB.isAdmin;
  let h = tmHero('🏆 대회 모드', '대회 등록 → 참가신청 → 핸디 확정 → 경기 → 시상 확정까지 한 곳에서 관리합니다.',
    `전체 ${TS.total}개 대회 · 로얄전당 ${TS.hofCount}건`);
  if (TS.err) h += `<div class="tm-blk">${tmEsc(TS.err)}</div>`;
  h += `<div class="tm-row">
    ${admin ? '<button class="tm-btn gd" data-tmnew="1">＋ 새 대회</button>' : ''}
    <button class="tm-btn gh" data-tmhof="1">🏛 로얄전당</button>
    <button class="tm-btn gh" data-tmreload="1">↻ 새로고침</button></div>`;
  h += '<div class="tm-cards">';
  (TS.list || []).forEach(t => {
    h += `<div class="tm-card" data-tmt="${tmEsc(t.tournamentId)}">
      <h3>${tmEsc(t.name)} <span class="tm-badge">${tmEsc(t.type)}</span></h3>
      <div class="tm-sub">${tmEsc(t.date)} · ${tmEsc(t.course || '')}${t.firstTee ? ' · ' + tmEsc(t.firstTee) : ''}</div>
      <div class="tm-sub">${tmEsc(t.status)} · 참가 ${tmN(t.players)}명 · 수상 ${tmN(t.winners)}건${t.entryFee ? ' · 참가비 ' + tmN(t.entryFee) : ''}</div>
    </div>`;
  });
  if (!(TS.list || []).length) h += `<div class="tm-empty">등록된 대회가 없습니다.${admin ? ' [＋ 새 대회]로 시작하세요.' : ' 관리자에게 문의하세요.'}</div>`;
  h += '</div>';
  return h;
}
function tmHero(title, sub, meta) {
  return `<div class="tm-hero"><h2>${title}</h2><div class="tm-meta">${tmEsc(sub)}</div>${meta ? `<div class="tm-meta" style="margin-top:6px">${tmEsc(meta)}</div>` : ''}</div>`;
}
function tmHofView() {
  return hofView();
}
function tmDetailView() {
  const t = TS.cur.tournament, admin = !!DB.isAdmin;
  const subs = admin
    ? [['home', '개요'], ['players', '참가자·핸디'], ['holes', '특별홀'], ['award', '시상·상품'], ['review', '후보·확정'], ['result', '결과'], ['audit', '감사']]
    : [['home', '개요'], ['myhcp', '내 대회핸디'], ['group', '조편성'], ['board', '리더보드'], ['special', '내 특별기록'], ['result', '결과']];
  let h = tmHero('🏆 ' + tmEsc(t.name), `${tmEsc(t.type)} · ${tmEsc(t.date)} · ${tmEsc(t.course || '')}${t.firstTee ? ' · ' + tmEsc(t.firstTee) : ''}`,
    `${t.status} · 참가 ${tmN(t.players)}명 · 수상 ${tmN(t.winners)}건${admin && t.budget ? ' · 예산 ' + tmN(t.budget) : ''}`);
  h += `<div class="tm-row"><button class="tm-btn gh" data-tmlist="1">← 목록</button>
    <button class="tm-btn gh" data-tmreload="1">↻</button>
    ${admin ? '<button class="tm-btn gh" data-tmedit="1">대회 정보 수정</button>' : ''}</div>`;
  h += tmStatusFlow(t);
  h += '<div class="tm-sub-nav">' + subs.map(s => `<button data-tmsub="${s[0]}" aria-selected="${TS.sub === s[0]}">${s[1]}</button>`).join('') + '</div>';
  if (TS.err) h += `<div class="tm-blk">${tmEsc(TS.err)}</div>`;
  if (TS.msg) h += `<div class="tm-warn">${tmEsc(TS.msg)}</div>`;
  h += tmSubView();
  return h;
}
function tmStatusFlow(t) {
  const cur = TM_ST.indexOf(t.status), admin = !!DB.isAdmin;
  return '<div class="tm-flow">' + TM_ST.map((s, i) =>
    `<span class="${i === cur ? 'on' : ''}" ${admin && s !== '시상확정' ? `data-tmst="${s}" style="cursor:pointer"` : ''}>${i + 1}. ${s}</span>`).join('') + '</div>';
}
function tmSubView() {
  switch (TS.sub) {
    case 'home': return tmHome();
    case 'players': return tmPlayers();
    case 'myhcp': return tmMyHcp();
    case 'group': return tmGroupView();

function tmReview() {

  let h = '<div class="tm-box"><h3>검토·확정</h3><div class="tm-row">';

  h += '<div class="tm-meta">확정하면 수상 기록이 잠기고 로얄전당에 등록됩니다. 이후 정정은 사유가 필요합니다.</div></div>';
  if (TS.pre) {

      (TS.pre.block.length ? TS.pre.block.map(b => `<div class="tm-blk">⛔ ${tmEsc(b)}</div>`).join('') : '<div class="tm-meta">차단 사유 없음 ✓</div>') +
      (TS.pre.warn.length ? TS.pre.warn.map(w => `<div class="tm-warn">⚠ ${tmEsc(w)}</div>`).join('') : '') + '</div>';
  }
  h += '<div class="tm-box"><h3>시상별 후보·당선</h3>';
  C.rules.forEach(r => {
    const cs = C.candidates.filter(c => c.awardRuleId === r.awardRuleId);

    else {
      h += '<table class="tm-tbl"><tbody>';
      cs.forEach(c => {
        h += `<tr class="${c.status === '중복제외' || c.status === '제외' ? 'tm-out' : ''}"><td>${tmEsc(c.memberName)}</td><td class="tm-meta">${tmEsc(tmBasisOut(c.basis))}</td>
          <td>${c.status === '당선' ? '<span class="tm-gold">당선</span>' : tmEsc(c.status)}${c.dupFlag ? ' <small>중복</small>' : ''}</td>
          <td>${C.locked ? '' : `<button class="tm-btn gh" data-tmcand="${tmEsc(c.candId)}" data-tmcs="${c.status === '당선' ? '후보' : '당선'}">${c.status === '당선' ? '당선취소' : '당선'}</button>`}
            ${C.locked ? '' : `<button class="tm-btn gh" data-tmcand="${tmEsc(c.candId)}" data-tmcs="제외">제외</button>`}</td></tr>`;
      });
      h += '</tbody></table>';
    }
    h += '</div>';
  });
  h += '</div>';
  if (C.winners.length) {
    h += '<div class="tm-box"><h3>확정 수상자 ' + C.winners.length + '건</h3><table class="tm-tbl"><thead><tr><th>시상</th><th>회원</th><th>근거</th><th></th></tr></thead><tbody>';
    C.winners.forEach(w => {
      h += `<tr><td>${tmEsc(w.awardName)}</td><td>${tmEsc(w.memberName)}</td><td>${tmEsc(tmBasisOut(w.basis))}</td>
        <td><button class="tm-btn gh" data-tmcorr="${tmEsc(w.winnerId)}">정정</button></td></tr>`;
    });
    h += '</tbody></table></div>';
  }
  return h;
}

function tmResult() {
  const R = TS.result;

  if (R.ready === false || (!R.winners && !R.board)) return '<div class="tm-empty">시상이 확정되면 결과가 공개됩니다.</div>';
  let h = tmHero('🏆 ' + tmEsc(R.name || ''), `${tmEsc(R.type || '')} · ${tmEsc(R.date || '')} · ${tmEsc(R.course || '')}`, `상태 ${tmEsc(R.status || '')}`);
  h += '<div class="tm-box"><h3>수상자</h3>';
  if (!R.winners || !R.winners.length) h += '<div class="tm-empty">등록된 수상자가 없습니다.</div>';
  else {
    h += '<table class="tm-tbl"><thead><tr><th>시상</th><th>회원</th><th>근거</th>' + (DB.isAdmin ? '<th>상품</th><th></th>' : '') + '</tr></thead><tbody>';
    R.winners.forEach(w => {
      h += `<tr><td>${tmEsc(w.awardName)}</td><td class="tm-gold">${tmEsc(w.memberName)}</td><td>${tmEsc(tmBasisOut(w.basis))}</td>`;
      if (DB.isAdmin) h += `<td>${tmEsc(w.prize || '-')}${w.prizeAmount ? ' (' + tmN(w.prizeAmount).toLocaleString() + '원)' : ''}</td><td><button class="tm-btn gh" data-tmcorr="${tmEsc(w.winnerId)}">정정</button></td>`;
      h += '</tr>';
    });
    h += '</tbody></table>';
  }
  h += '</div>';
  if (R.board) {
    h += '<div class="tm-box"><h3>최종 순위</h3><table class="tm-tbl"><thead><tr><th class="n">#</th><th>회원</th><th class="n">Gross</th><th class="n">핸디</th><th class="n">Net</th></tr></thead><tbody>';

    h += '</tbody></table></div>';
  }
  return h;

/* ---------------- 이벤트 바인딩 ---------------- */
function tmBind() {

  const qa = (s, r) => [...(r || document).querySelectorAll(s)];
  document.querySelectorAll('nav button').forEach(b => {
    if (b.dataset.tab === 'tournament') { b.onclick = () => { tab = 'tournament'; render(); }; }
    else if (!b.dataset.tmHook) { b.dataset.tmHook = '1'; b.addEventListener('click', () => tmTheme(false)); }
  });
  qa('[data-tmt]').forEach(e => e.onclick = () => tmLoadOne(e.dataset.tmt));
  qa('[data-tmnew]').forEach(e => e.onclick = () => { TS.view = 'new'; TS.cur = TS.cur; tmRe(); });
  qa('[data-tmedit]').forEach(e => e.onclick = () => { TS.view = 'new'; tmRe(); });

  qa('[data-tmgo]').forEach(e => e.onclick = () => {
    const s = e.dataset.tmgo;
    tmAct(api('setTournamentStatus', PW, TS.tid, s, ''), '상태를 ' + s + '로 변경했습니다').then(() => tmLoadOne(TS.tid));
  });
  qa('[data-tmst]').forEach(e => e.onclick = () => {
    const s = e.dataset.tmst, t = TS.cur.tournament;

    h += src ? `<img src="${hofEsc(src)}" alt="${hofEsc(m.caption || '대회 사진')}" loading="lazy">` : `<span class="ph">${hofIcon('i-camera')}</span>`;
    h += `<figcaption class="cap"><b>${hofEsc(m.caption || '사진 ' + (i + 1))}</b><small>${hofEsc(hofMediaTypeName(m.mediaType))} · ${i + 1}</small></figcaption>`;
    if (adm) h += `<button class="del" data-hfmdel="${hofEsc(m.mediaId)}" title="삭제" aria-label="사진 삭제">✕</button>`;
    h += '</figure>';
  });
  return h + '</div>';
}
function hofMediaResize(file, max, cb) {
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const sc = Math.min(1, max / Math.max(im.width, im.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(im.width * sc)); cv.height = Math.max(1, Math.round(im.height * sc));
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => cb(null);
    im.src = rd.result;
  };
  rd.onerror = () => cb(null);
  rd.readAsDataURL(file);
}
function hofMediaAdd() {
  const f = $('#hfmFile'), files = Array.from((f && f.files) || []).slice(0, 6);
  if (!files.length) return toast('사진을 선택하세요');
  const cap = (($('#hfmCap') || {}).value || '');
  const ty = (($('#hfmType') || {}).value || 'group');
  let i = 0, done = 0;
  const step = () => {
    if (i >= files.length) { busy(false); toast(done + '장 등록했습니다'); return hofOpen(HS.tid); }
    const fl = files[i++];
    if (!/^image\/(jpeg|png|webp)$/.test(fl.type)) { toast('JPG · PNG · WebP 파일만 등록할 수 있습니다'); return step(); }
    if (fl.size > 8 * 1024 * 1024) { toast('8MB 이하 사진을 선택하세요'); return step(); }
    hofMediaResize(fl, 1200, du => {
      if (!du) { toast('이미지를 읽을 수 없습니다'); return step(); }
      api('hofAddMedia', PW, HS.tid, du, cap, ty).then(() => { done++; step(); }).catch(e => { toast(errMsg(e), 5000); step(); });
    });
  };
  busy(true); step();
}
